# golgoru.app 방문 수(쿠키 · IP 없음). 비밀 없음 — 이 파일은 커밋한다.
#   cd ~/Claude/asset-management/serverless
#   npx wrangler deploy --config ~/Claude/golgoru/scripts/hits/wrangler.toml
# 조회: npx wrangler d1 execute golgoru-hits --remote --command "SELECT ..." --config ~/Claude/golgoru/scripts/hits/wrangler.toml
name = "golgoru-hits"
