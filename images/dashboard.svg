<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="420" fill="#FAF7F2"/>
  <!-- phone frame -->
  <rect x="30" y="20" width="300" height="380" rx="24" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="180" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#3A3A3A">대시보드</text>

  <!-- total asset card -->
  <rect x="50" y="72" width="260" height="64" rx="12" fill="#FDF6E3"/>
  <text x="66" y="96" font-size="11" fill="#8A7B4F">총 자산</text>
  <text x="66" y="120" font-size="19" font-weight="700" fill="#3A3A3A">₩ •••,•••,•••</text>
  <text x="294" y="96" text-anchor="end" font-size="11" fill="#8A7B4F">현금 비중</text>
  <text x="294" y="118" text-anchor="end" font-size="14" font-weight="600" fill="#3A3A3A">7.1%</text>

  <!-- category composition -->
  <text x="50" y="162" font-size="12" font-weight="600" fill="#666">카테고리 구성</text>
  <rect x="50" y="172" width="104" height="14" rx="7" fill="#C9A227"/>
  <rect x="156" y="172" width="65" height="14" rx="7" fill="#8FBF9F"/>
  <rect x="223" y="172" width="47" height="14" rx="7" fill="#7FA8C9"/>
  <rect x="272" y="172" width="38" height="14" rx="7" fill="#D0C6AE"/>
  <text x="50" y="202" font-size="10" fill="#999">주식/ETF · 펀드 · 코인 · 현금 ···</text>

  <!-- market indicators -->
  <text x="50" y="228" font-size="12" font-weight="600" fill="#666">시장지표</text>
  <rect x="50" y="238" width="82" height="40" rx="8" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="91" y="253" text-anchor="middle" font-size="10" fill="#999">코스피</text>
  <text x="61" y="270" font-size="12" font-weight="600" fill="#3A3A3A">2,•••</text>
  <polyline points="99,272 104,268 109,270 114,264 119,266 124,260" fill="none" stroke="#8FBF9F" stroke-width="1.3"/>
  <rect x="139" y="238" width="82" height="40" rx="8" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="180" y="253" text-anchor="middle" font-size="10" fill="#999">나스닥100</text>
  <text x="150" y="270" font-size="12" font-weight="600" fill="#3A3A3A">••,•••</text>
  <polyline points="189,268 194,270 199,264 204,266 209,261 214,258" fill="none" stroke="#8FBF9F" stroke-width="1.3"/>
  <rect x="228" y="238" width="82" height="40" rx="8" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="269" y="253" text-anchor="middle" font-size="10" fill="#999">USD/KRW</text>
  <text x="269" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#3A3A3A">1,3••</text>

  <!-- allocation gap -->
  <text x="50" y="306" font-size="12" font-weight="600" fill="#666">자산배분 차이 ›</text>
  <rect x="50" y="316" width="260" height="30" rx="8" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="62" y="335" font-size="11" fill="#3A3A3A">글로벌 인덱스 ETF</text>
  <text x="298" y="335" text-anchor="end" font-size="11" font-weight="700" fill="#C0392B">+3.2%p</text>
  <rect x="50" y="350" width="260" height="30" rx="8" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="62" y="369" font-size="11" fill="#3A3A3A">국내 성장형 펀드</text>
  <text x="298" y="369" text-anchor="end" font-size="11" font-weight="700" fill="#1A5276">−2.1%p</text>

  <!-- annotations -->
  <g font-size="12.5" fill="#5B5343">
    <text x="370" y="98">① 총자산과 현금 비중</text>
    <text x="386" y="116" font-size="11" fill="#948A72">시트·앱 입력 어느 쪽이든 같은 화면</text>
    <text x="370" y="188">② 자산군별 구성 비중 바</text>
    <text x="370" y="258">③ 환율·금리·유가 — 전용 새로고침,</text>
    <text x="386" y="276" font-size="11" fill="#948A72">실패한 지표는 마지막 정상값 유지</text>
    <text x="370" y="335">④ 목표 비중과 가장 벌어진 항목 —</text>
    <text x="386" y="353" font-size="11" fill="#948A72">탭하면 자산배분 화면으로 이동</text>
  </g>
  <line x1="315" y1="104" x2="362" y2="94" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="179" x2="362" y2="184" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="258" x2="362" y2="254" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="331" x2="362" y2="331" stroke="#C9B98A" stroke-width="1.5"/>
</svg>
