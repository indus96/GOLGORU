<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="420" fill="#FAF7F2"/>
  <!-- phone frame -->
  <rect x="30" y="20" width="300" height="380" rx="24" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <!-- 실물처럼 좌측 대형 제목 + 우상단 설정 기어 -->
  <text x="50" y="54" font-size="17" font-weight="800" fill="#3A3A3A">골고루</text>
  <circle cx="298" cy="48" r="9" fill="none" stroke="#C9A227" stroke-width="1.5"/>
  <circle cx="298" cy="48" r="3" fill="none" stroke="#C9A227" stroke-width="1.5"/>

  <!-- ① 시장지표 카드 — 실물 최상단: USD/KRW 히어로 + 2열 그리드 -->
  <rect x="50" y="66" width="260" height="152" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="62" y="84" font-size="11" font-weight="700" fill="#3A3A3A">시장</text>
  <!-- USD/KRW 히어로 셀 -->
  <rect x="60" y="92" width="240" height="42" rx="8" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="70" y="105" font-size="9" fill="#8A7B4F">USD/KRW</text>
  <text x="70" y="122" font-size="14" font-weight="700" fill="#3A3A3A">1,4••.••원</text>
  <rect x="196" y="108" width="94" height="16" rx="8" fill="#F9E3E3"/>
  <text x="243" y="120" text-anchor="middle" font-size="9" font-weight="600" fill="#C0392B">▲ 1•.••원 (1.1%)</text>
  <!-- 2열 미니 셀: 국채(bp)·유가($) -->
  <rect x="60" y="140" width="116" height="34" rx="8" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="68" y="152" font-size="8.5" fill="#8A7B4F">미국 국채 2년</text>
  <text x="68" y="166" font-size="11" font-weight="600" fill="#3A3A3A">4.2•%</text>
  <rect x="122" y="156" width="46" height="13" rx="6.5" fill="#F9E3E3"/>
  <text x="145" y="166" text-anchor="middle" font-size="8" font-weight="600" fill="#C0392B">▲ 1.0bp</text>
  <rect x="184" y="140" width="116" height="34" rx="8" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="192" y="152" font-size="8.5" fill="#8A7B4F">한국 국채 10년</text>
  <text x="192" y="166" font-size="11" font-weight="600" fill="#3A3A3A">4.2•%</text>
  <rect x="246" y="156" width="46" height="13" rx="6.5" fill="#E3EDF9"/>
  <text x="269" y="166" text-anchor="middle" font-size="8" font-weight="600" fill="#1A5276">▼ 5.0bp</text>
  <rect x="60" y="178" width="116" height="30" rx="8" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="68" y="190" font-size="8.5" fill="#8A7B4F">WTI</text>
  <text x="68" y="203" font-size="11" font-weight="600" fill="#3A3A3A">$8•.••</text>
  <rect x="184" y="178" width="116" height="30" rx="8" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="192" y="190" font-size="8.5" fill="#8A7B4F">Brent</text>
  <text x="192" y="203" font-size="11" font-weight="600" fill="#3A3A3A">$9•.••</text>

  <!-- ② 총 자산·현금 — 실물은 카드가 아니라 헤어라인 행 -->
  <text x="50" y="242" font-size="12" font-weight="600" fill="#3A3A3A">총 자산</text>
  <text x="310" y="242" text-anchor="end" font-size="13" font-weight="700" fill="#3A3A3A">₩ ••,•••,•••</text>
  <line x1="50" y1="252" x2="310" y2="252" stroke="#EEE7D8" stroke-width="1"/>
  <text x="50" y="270" font-size="12" font-weight="600" fill="#3A3A3A">현금</text>
  <text x="310" y="270" text-anchor="end" font-size="12" fill="#3A3A3A">₩ •,•••,•••</text>
  <line x1="50" y1="280" x2="310" y2="280" stroke="#EEE7D8" stroke-width="1"/>

  <!-- ③ 자산 구성 — 누적 막대 + 색점 범례 -->
  <text x="50" y="300" font-size="12" font-weight="600" fill="#3A3A3A">자산 구성 ›</text>
  <rect x="50" y="308" width="192" height="12" rx="6" fill="#F29940"/>
  <rect x="242" y="308" width="68" height="12" fill="#D95A2B"/>
  <rect x="296" y="308" width="14" height="12" rx="6" fill="#D95A2B"/>
  <circle cx="56" cy="334" r="3.5" fill="#F29940"/>
  <text x="64" y="338" font-size="10" fill="#3A3A3A">국내주식 74%</text>
  <circle cx="146" cy="334" r="3.5" fill="#D95A2B"/>
  <text x="154" y="338" font-size="10" fill="#3A3A3A">해외주식 26%</text>
  <circle cx="236" cy="334" r="3.5" fill="#B0A892"/>
  <text x="244" y="338" font-size="10" fill="#3A3A3A">현금 0%</text>

  <!-- ④ 플로팅 알약 탭바 — 2.0은 넷이다 -->
  <rect x="50" y="352" width="260" height="34" rx="17" fill="#FFFFFF" stroke="#E3DCCF"/>
  <rect x="56" y="356" width="56" height="26" rx="13" fill="#F5EBD4"/>
  <text x="84" y="373" text-anchor="middle" font-size="9" font-weight="700" fill="#8A6D1F">홈</text>
  <text x="149" y="373" text-anchor="middle" font-size="9" fill="#3A3A3A">자산</text>
  <text x="214" y="373" text-anchor="middle" font-size="9" fill="#3A3A3A">짜보기</text>
  <text x="279" y="373" text-anchor="middle" font-size="9" fill="#3A3A3A">뉴스</text>

  <!-- annotations -->
  <g font-size="12.5" fill="#5B5343">
    <text x="370" y="110">① 시장 — 지수 둘과 환율</text>
    <text x="386" y="128" font-size="11" fill="#948A72">전용 새로고침, 실패한 지표는 마지막 정상값 유지</text>
    <text x="370" y="252">② 총자산과 현금</text>
    <text x="386" y="270" font-size="11" fill="#948A72">시트·앱 입력 어느 쪽이든 같은 화면</text>
    <text x="370" y="316">③ 자산군별 구성 비중 바</text>
    <text x="386" y="334" font-size="11" fill="#948A72">「자세히 보기」를 누르면 구성 리포트로</text>
    <text x="370" y="374">④ 하단 탭 — 홈 · 자산 · 짜보기 · 뉴스</text>
  </g>
  <line x1="315" y1="140" x2="362" y2="112" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="246" x2="362" y2="248" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="314" x2="362" y2="312" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="369" x2="362" y2="370" stroke="#C9B98A" stroke-width="1.5"/>
</svg>
