<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="860" height="400" fill="#FAF7F2"/>
  <text x="430" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#3A3A3A">증권사 연결 — 설정에서 2단계로 관리</text>

  <!-- level 1: list -->
  <rect x="40" y="66" width="300" height="300" rx="20" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="190" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#3A3A3A">증권사 연결 (1단계)</text>

  <g>
    <rect x="58" y="112" width="264" height="52" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
    <circle cx="82" cy="138" r="12" fill="#FDF6E3"/>
    <text x="82" y="142" text-anchor="middle" font-size="9" fill="#7A6A33">한투</text>
    <text x="102" y="133" font-size="12" fill="#3A3A3A">한국투자증권</text>
    <text x="102" y="150" font-size="10.5" font-weight="600" fill="#2E7D32">연결됨</text>
  </g>
  <g>
    <rect x="58" y="172" width="264" height="52" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
    <circle cx="82" cy="198" r="12" fill="#FDF6E3"/>
    <text x="82" y="202" text-anchor="middle" font-size="9" fill="#7A6A33">한투</text>
    <text x="102" y="193" font-size="12" fill="#3A3A3A">한국투자증권 · 연금저축</text>
    <text x="102" y="210" font-size="10.5" font-weight="600" fill="#B26A00">키 저장됨 · 연결 확인 필요</text>
  </g>
  <g>
    <rect x="58" y="232" width="264" height="52" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
    <circle cx="82" cy="258" r="12" fill="#EAF2F8"/>
    <text x="82" y="262" text-anchor="middle" font-size="9" fill="#1A5276">토스</text>
    <text x="102" y="253" font-size="12" fill="#3A3A3A">토스증권</text>
    <text x="102" y="270" font-size="10.5" fill="#999">미설정</text>
  </g>
  <g>
    <rect x="58" y="292" width="264" height="52" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
    <circle cx="82" cy="318" r="12" fill="#EAF2F8"/>
    <text x="82" y="322" text-anchor="middle" font-size="8" fill="#1A5276">업비트</text>
    <text x="102" y="313" font-size="12" fill="#3A3A3A">업비트</text>
    <text x="102" y="330" font-size="10.5" fill="#999">미설정</text>
  </g>

  <line x1="340" y1="200" x2="400" y2="200" stroke="#B4A268" stroke-width="2"/>
  <polygon points="400,200 390,194 390,206" fill="#B4A268"/>
  <text x="370" y="186" text-anchor="middle" font-size="11" fill="#8A7B4F">탭</text>

  <!-- level 2: detail -->
  <rect x="400" y="66" width="300" height="300" rx="20" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="550" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#3A3A3A">증권사 상세 (2단계)</text>

  <text x="420" y="126" font-size="11.5" font-weight="600" fill="#666">자격증명</text>
  <rect x="420" y="136" width="260" height="26" rx="7" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="432" y="153" font-size="11" fill="#BBB">앱키 / Access Key</text>
  <rect x="420" y="168" width="260" height="26" rx="7" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="432" y="185" font-size="11" fill="#BBB">시크릿 (입력 후 가려짐)</text>
  <rect x="420" y="202" width="126" height="30" rx="8" fill="#C9A227"/>
  <text x="483" y="221" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFF">저장 (Keychain)</text>
  <rect x="554" y="202" width="126" height="30" rx="8" fill="#E8F5E9"/>
  <text x="617" y="221" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2E7D32">연결 확인</text>

  <text x="420" y="262" font-size="11.5" font-weight="600" fill="#666">시트 계좌 연동 (한투)</text>
  <rect x="420" y="272" width="260" height="26" rx="7" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="432" y="289" font-size="11" fill="#7A6A33">시트 계좌 블록명 → 연동/생성</text>
  <text x="420" y="322" font-size="10.5" fill="#948A72">연결 확인 통과 → 목록에 ‘연결됨’ 표시</text>
  <text x="420" y="338" font-size="10.5" fill="#948A72">키 재저장·삭제 → 다시 ‘확인 필요’로</text>

  <text x="430" y="388" text-anchor="middle" font-size="11.5" fill="#999">자격증명은 기기 Keychain에 생체인증 보호로 저장 — 서버 전송 없음</text>
</svg>
