    <text x="386" y="270" font-size="11" fill="#948A72">눌러 들어가면 도넛과 전체 목록</text>
    <text x="370" y="300">④ 올린 사람은 앱이 지어 준 이름</text>
    <text x="386" y="318" font-size="11" fill="#948A72">계정도 프로필도 필요 없습니다</text>
    <text x="370" y="360">⑤ 금액은 올라가지 않습니다</text>
  </g>
