  <g font-size="12.5" fill="#5B5343">
    <text x="370" y="128">① 인기 · 최신 · 내가 올린</text>
    <text x="386" y="146" font-size="11" fill="#948A72">「감춘 것」은 관리자에게만 보입니다</text>
