<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="380" fill="#FAF7F2"/>
  <rect x="30" y="20" width="300" height="340" rx="24" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="50" y="54" font-size="17" font-weight="800" fill="#3A3A3A">자산순위</text>

  <!-- ① 세그먼트 — 실물은 계좌별/항목별 두 개(흰 알약 선택) -->
  <rect x="50" y="66" width="260" height="26" rx="13" fill="#F2EDE0"/>
  <rect x="182" y="68" width="126" height="22" rx="11" fill="#FFFFFF" stroke="#E3DCCF"/>
  <text x="115" y="83" text-anchor="middle" font-size="11" fill="#8A7B4F">계좌별</text>
  <text x="245" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#3A3A3A">항목별</text>

  <!-- 갱신 + 정렬 텍스트 줄 -->
  <text x="50" y="112" font-size="9.5" fill="#948A72">갱신 2026.08.02 16:09</text>
  <text x="310" y="112" text-anchor="end" font-size="10" fill="#948A72">잔고  |  <tspan font-weight="700" fill="#C9A227">평가액 ↓</tspan>  |  수익금</text>

  <!-- ② 흰 카드 안 종목 행: 로고 타일 + 이름/주수, 우측 평가액 + 수익금 + › -->
  <rect x="50" y="124" width="260" height="188" rx="14" fill="#FFFFFF" stroke="#EEE7D8"/>
  <g>
    <rect x="62" y="138" width="34" height="34" rx="9" fill="#F6E7E7"/>
    <text x="79" y="160" text-anchor="middle" font-size="12">📈</text>
    <text x="104" y="152" font-size="12" font-weight="700" fill="#3A3A3A">SK하이닉스</text>
    <text x="104" y="168" font-size="10" fill="#948A72">10주</text>
    <text x="292" y="152" text-anchor="end" font-size="12" font-weight="700" fill="#3A3A3A">₩ ••,•••,•••</text>
    <text x="300" y="152" text-anchor="end" font-size="11" fill="#B8B0A0">›</text>
    <text x="292" y="168" text-anchor="end" font-size="10" font-weight="600" fill="#C0392B">₩ •,•••,••• (32.2%)</text>
  </g>
  <line x1="62" y1="182" x2="298" y2="182" stroke="#EEE7D8" stroke-width="1"/>
  <g>
    <rect x="62" y="192" width="34" height="34" rx="9" fill="#F6E7E7"/>
    <text x="79" y="214" text-anchor="middle" font-size="12">🚗</text>
    <text x="104" y="206" font-size="12" font-weight="700" fill="#3A3A3A">테슬라</text>
    <text x="104" y="222" font-size="10" fill="#948A72">10주 · $ 환산</text>
    <text x="292" y="206" text-anchor="end" font-size="12" font-weight="700" fill="#3A3A3A">₩ •,•••,•••</text>
    <text x="300" y="206" text-anchor="end" font-size="11" fill="#B8B0A0">›</text>
    <text x="292" y="222" text-anchor="end" font-size="10" font-weight="600" fill="#C0392B">₩ •••,••• (3.7%)</text>
  </g>
  <line x1="62" y1="236" x2="298" y2="236" stroke="#EEE7D8" stroke-width="1"/>
  <g>
    <rect x="62" y="246" width="34" height="34" rx="9" fill="#EDEDF2"/>
    <text x="79" y="268" text-anchor="middle" font-size="12">🚀</text>
    <text x="104" y="260" font-size="12" font-weight="700" fill="#3A3A3A">스페이스X</text>
    <text x="104" y="276" font-size="10" fill="#948A72">10주</text>
    <text x="292" y="260" text-anchor="end" font-size="12" font-weight="700" fill="#3A3A3A">₩ •,•••,•••</text>
    <text x="300" y="260" text-anchor="end" font-size="11" fill="#B8B0A0">›</text>
    <text x="292" y="276" text-anchor="end" font-size="10" font-weight="600" fill="#1A5276">₩ •••,••• (9.7%)</text>
  </g>

  <!-- 시세 갱신 힌트 -->
  <text x="180" y="336" text-anchor="middle" font-size="9.5" fill="#948A72">종목 탭 → 상세 차트 · 보유 종목 시세 1초 자동 갱신</text>

  <!-- annotations -->
  <g font-size="12.5" fill="#5B5343">
    <text x="370" y="84">① 계좌별 / 항목별 전환</text>
    <text x="386" y="102" font-size="11" fill="#948A72">잔고·평가액·수익금 정렬</text>
    <text x="370" y="152">② 같은 종목은 계좌를 넘어 합산</text>
    <text x="386" y="170" font-size="11" fill="#948A72">해외 자산은 달러 평가액에 환율 적용</text>
    <text x="370" y="226">③ 수익은 색으로 — 상승 빨강 · 하락 파랑</text>
    <text x="386" y="244" font-size="11" fill="#948A72">부호 대신 색과 %로 읽는다</text>
    <text x="370" y="300">④ 보유 종목 시세 1초 자동 갱신</text>
    <text x="386" y="318" font-size="11" fill="#948A72">평가액·수익 즉시 재계산 (원장은 불변)</text>
  </g>
  <line x1="315" y1="79" x2="362" y2="80" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="155" x2="362" y2="148" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="222" x2="362" y2="222" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="290" x2="362" y2="296" stroke="#C9B98A" stroke-width="1.5"/>
</svg>
