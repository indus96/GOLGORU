<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="860" height="360" fill="#FAF7F2"/>
  <text x="430" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#3A3A3A">리밸런싱 3단계 — 계획을 보고 승인해야 주문이 나갑니다</text>

  <!-- step 1 -->
  <rect x="30" y="70" width="240" height="170" rx="14" fill="#FFFFFF" stroke="#E3DCCF"/>
  <circle cx="58" cy="98" r="13" fill="#C9A227"/>
  <text x="58" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF">1</text>
  <text x="80" y="103" font-size="14" font-weight="700" fill="#3A3A3A">선택</text>
  <rect x="50" y="118" width="200" height="24" rx="6" fill="#FDF6E3"/>
  <text x="150" y="134" text-anchor="middle" font-size="11" fill="#7A6A33">계좌·종목 범위 선택</text>
  <rect x="50" y="148" width="200" height="24" rx="6" fill="#FDF6E3"/>
  <text x="150" y="164" text-anchor="middle" font-size="11" fill="#7A6A33">직접 주문(수량·방향)도 가능</text>
  <text x="50" y="200" font-size="10.5" fill="#948A72">목표 비중과의 차이가 있는</text>
  <text x="50" y="215" font-size="10.5" fill="#948A72">항목이 자동으로 잡힙니다</text>

  <line x1="270" y1="155" x2="310" y2="155" stroke="#B4A268" stroke-width="2"/>
  <polygon points="310,155 300,149 300,161" fill="#B4A268"/>

  <!-- step 2 -->
  <rect x="310" y="70" width="240" height="170" rx="14" fill="#FFFFFF" stroke="#E3DCCF"/>
  <circle cx="338" cy="98" r="13" fill="#C9A227"/>
  <text x="338" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF">2</text>
  <text x="360" y="103" font-size="14" font-weight="700" fill="#3A3A3A">계획</text>
  <rect x="330" y="118" width="200" height="24" rx="6" fill="#FDF6E3"/>
  <text x="430" y="134" text-anchor="middle" font-size="11" fill="#7A6A33">매도 → 매수 주문 목록·금액</text>
  <rect x="330" y="148" width="200" height="24" rx="6" fill="#FDF6E3"/>
  <text x="430" y="164" text-anchor="middle" font-size="11" fill="#7A6A33">기간 분할 (예: 3회 · 7일 간격)</text>
  <text x="330" y="200" font-size="10.5" fill="#948A72">예정일이 주말·공휴일이면</text>
  <text x="330" y="215" font-size="10.5" fill="#948A72">다음 영업일로 자동 이동</text>

  <line x1="550" y1="155" x2="590" y2="155" stroke="#B4A268" stroke-width="2"/>
  <polygon points="590,155 580,149 580,161" fill="#B4A268"/>

  <!-- step 3 -->
  <rect x="590" y="70" width="240" height="170" rx="14" fill="#FFFFFF" stroke="#E3DCCF"/>
  <circle cx="618" cy="98" r="13" fill="#C9A227"/>
  <text x="618" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF">3</text>
  <text x="640" y="103" font-size="14" font-weight="700" fill="#3A3A3A">실행</text>
  <rect x="610" y="118" width="200" height="24" rx="6" fill="#E8F5E9"/>
  <text x="710" y="134" text-anchor="middle" font-size="11" fill="#2E7D32">승인 후에만 주문 전송</text>
  <rect x="610" y="148" width="200" height="24" rx="6" fill="#FDF6E3"/>
  <text x="710" y="164" text-anchor="middle" font-size="11" fill="#7A6A33">즉시 실행 또는 시각 예약</text>
  <text x="610" y="200" font-size="10.5" fill="#948A72">체결은 실시간 통보 + 폴링 +</text>
  <text x="610" y="215" font-size="10.5" fill="#948A72">잔고 대조로 3중 확인</text>

  <!-- safety row -->
  <rect x="30" y="264" width="800" height="66" rx="12" fill="#FFF8EC" stroke="#EFE3C4"/>
  <text x="50" y="290" font-size="13" font-weight="700" fill="#8D6E30">실행 안전장치</text>
  <text x="50" y="314" font-size="12" fill="#6E6248">장 마감·휴장일(한국·미국 공휴일) 주문은 보내지 않고 대기  ·  실패 시 증권사 사유 그대로 표시 + 실패분만 재시도  ·  회차마다 예정일 알림 → 승인 → 진행  ·  체결만 시트에 자동 기록</text>
</svg>
