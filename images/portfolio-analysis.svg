<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="470" fill="#FAF7F2"/>

  <!-- phone frame -->
  <rect x="30" y="20" width="300" height="430" rx="24" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="180" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#3A3A3A">자산 구성 분석</text>

  <!-- section tabs -->
  <rect x="50" y="64" width="260" height="26" rx="8" fill="#F1EADB"/>
  <rect x="52" y="66" width="63" height="22" rx="6" fill="#FFFFFF" stroke="#E3DCCF"/>
  <text x="83" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#3A3A3A">요약</text>
  <text x="147" y="81" text-anchor="middle" font-size="11" fill="#948A72">구성</text>
  <text x="211" y="81" text-anchor="middle" font-size="11" fill="#948A72">수익</text>
  <text x="275" y="81" text-anchor="middle" font-size="11" fill="#948A72">추정</text>

  <!-- health score card -->
  <rect x="50" y="100" width="260" height="92" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="66" y="122" font-size="11" fill="#8A7B4F">투자 건강점수</text>
  <text x="294" y="126" text-anchor="end" font-size="26" font-weight="800" fill="#C9A227">86</text>
  <text x="294" y="126" text-anchor="end" font-size="26" font-weight="800" fill="#C9A227" opacity="0"> </text>
  <!-- score bar -->
  <rect x="66" y="134" width="228" height="8" rx="4" fill="#EFE8D8"/>
  <rect x="66" y="134" width="196" height="8" rx="4" fill="#C9A227"/>
  <text x="66" y="160" font-size="11" font-weight="700" fill="#C9A227">건강</text>
  <text x="96" y="160" font-size="11" fill="#948A72">한두 가지만 손보면 돼요</text>
  <!-- deduction rows -->
  <text x="66" y="180" font-size="10.5" font-weight="700" fill="#1A5276">−4</text>
  <text x="90" y="180" font-size="10.5" fill="#5B5343">종목 분산</text>
  <text x="294" y="180" text-anchor="end" font-size="10" fill="#948A72">유효 17.6개</text>

  <!-- insight card -->
  <rect x="50" y="200" width="260" height="62" rx="12" fill="#FDF6E3"/>
  <circle cx="64" cy="219" r="3" fill="#C0392B"/>
  <text x="76" y="223" font-size="11" fill="#3A3A3A">현금이 3%예요. 조정 여력이 부족해요.</text>
  <circle cx="64" cy="243" r="3" fill="#D9822B"/>
  <text x="76" y="247" font-size="11" fill="#3A3A3A">달러 자산이 61%라 환율에 민감해요.</text>

  <!-- projection card -->
  <text x="50" y="286" font-size="11" font-weight="600" fill="#666">자산 추정</text>
  <rect x="50" y="294" width="260" height="60" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="66" y="314" font-size="10.5" fill="#948A72">10년 뒤</text>
  <text x="294" y="314" text-anchor="end" font-size="14" font-weight="700" fill="#3A3A3A">₩ •••,•••,•••</text>
  <text x="66" y="332" font-size="9.5" fill="#B3A986">원금 ₩••• · 수익 ₩•••</text>
  <text x="66" y="346" font-size="9" fill="#B3A986">중립 7% 가정 · 실제 수익 보장 아님</text>

  <!-- goal card -->
  <text x="50" y="378" font-size="11" font-weight="600" fill="#666">목표 달성</text>
  <rect x="50" y="386" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <rect x="66" y="410" width="228" height="8" rx="4" fill="#EFE8D8"/>
  <rect x="66" y="410" width="132" height="8" rx="4" fill="#8FBF9F"/>
  <text x="66" y="404" font-size="10.5" fill="#5B5343">달성률 58%</text>
  <text x="294" y="404" text-anchor="end" font-size="10.5" font-weight="700" fill="#3A7D52">2031~2037년</text>

  <!-- annotations -->
  <g font-size="12.5" fill="#5B5343">
    <text x="370" y="80">① 4개 탭 — 요약 · 구성 · 수익 · 추정</text>
    <text x="386" y="98" font-size="11" fill="#948A72">첫 탭은 "지금 어떤가"만 30초 요약</text>

    <text x="370" y="134">② 투자 건강점수 (100점)</text>
    <text x="386" y="152" font-size="11" fill="#948A72">8개 기준 · 감점/가점 사유 상위 3</text>

    <text x="370" y="218">③ AI 인사이트 — 규칙 엔진 문장</text>
    <text x="386" y="236" font-size="11" fill="#948A72">심각도순 최대 3 · 개별 거래는 미전송</text>

    <text x="370" y="316">④ 1·3·5·10년 자산 추정</text>
    <text x="386" y="334" font-size="11" fill="#948A72">입금과 수익을 분리해 계산</text>
    <text x="386" y="350" font-size="11" fill="#948A72">시나리오·월 적립액을 바로 조절</text>

    <text x="370" y="408">⑤ 목표 달성 — 연도 범위로 예측</text>
    <text x="386" y="426" font-size="11" fill="#948A72">보수·중립·낙관 3개 시나리오</text>
  </g>

  <line x1="315" y1="77" x2="362" y2="76" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="130" x2="362" y2="130" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="219" x2="362" y2="214" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="322" x2="362" y2="312" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="410" x2="362" y2="404" stroke="#C9B98A" stroke-width="1.5"/>
</svg>
