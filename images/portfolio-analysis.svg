<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="470" fill="#FAF7F2"/>
  <rect x="30" y="20" width="300" height="430" rx="24" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="50" y="54" font-size="16" font-weight="800" fill="#3A3A3A">자산 구성 분석</text>

  <!-- ① 세그먼트: 요약(선택)/구성/수익/추정 -->
  <rect x="50" y="64" width="260" height="24" rx="12" fill="#F2EDE0"/>
  <rect x="52" y="66" width="62" height="20" rx="10" fill="#FFFFFF" stroke="#E3DCCF"/>
  <text x="83" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#3A3A3A">요약</text>
  <text x="147" y="80" text-anchor="middle" font-size="10" fill="#8A7B4F">구성</text>
  <text x="212" y="80" text-anchor="middle" font-size="10" fill="#8A7B4F">수익</text>
  <text x="277" y="80" text-anchor="middle" font-size="10" fill="#8A7B4F">추정</text>

  <!-- ② 투자 건강점수 카드 -->
  <rect x="50" y="98" width="260" height="130" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="62" y="118" font-size="11" font-weight="700" fill="#3A3A3A">투자 건강점수</text>
  <text x="298" y="121" text-anchor="end" font-size="17" font-weight="800" fill="#C9A227">83<tspan font-size="10" fill="#948A72"> / 100</tspan></text>
  <rect x="62" y="128" width="236" height="8" rx="4" fill="#F0EBDD"/>
  <rect x="62" y="128" width="196" height="8" rx="4" fill="#C9A227"/>
  <text x="62" y="150" font-size="10" font-weight="700" fill="#C9A227">건강 <tspan font-weight="400" fill="#948A72">한두 가지만 손보면 돼요</tspan></text>
  <text x="62" y="170" font-size="10" font-weight="700" fill="#1A5276">−7</text>
  <text x="84" y="170" font-size="10" fill="#3A3A3A">현금 비중</text>
  <text x="298" y="170" text-anchor="end" font-size="9" fill="#948A72">현금·저축 3%</text>
  <text x="62" y="188" font-size="10" font-weight="700" fill="#1A5276">−5</text>
  <text x="84" y="188" font-size="10" fill="#3A3A3A">목표 비중 준수</text>
  <text x="298" y="188" text-anchor="end" font-size="9" fill="#948A72">목표 대비 편차 11%</text>
  <text x="62" y="206" font-size="10" font-weight="700" fill="#C0392B">+15</text>
  <text x="84" y="206" font-size="10" fill="#3A3A3A">자산군 분산</text>
  <text x="298" y="206" text-anchor="end" font-size="9" fill="#948A72">유효 자산군 5.7개</text>
  <text x="62" y="222" font-size="8.5" fill="#B8B0A0">감점 큰 순으로 정렬 — 근거 수치가 오른쪽</text>

  <!-- ③ 인사이트 카드 (웜 배경) -->
  <rect x="50" y="238" width="260" height="76" rx="12" fill="#FDF6E3"/>
  <circle cx="64" cy="256" r="3" fill="#E05252"/>
  <text x="74" y="260" font-size="10" fill="#5B4A1F">현금이 3%예요. 조정할 여력이 부족해요.</text>
  <text x="74" y="274" font-size="9" font-weight="600" fill="#C9A227">현금 확보</text>
  <circle cx="64" cy="292" r="3" fill="#E5A03C"/>
  <text x="74" y="296" font-size="10" fill="#5B4A1F">목표 비중과 벌어진 항목이 있어요.</text>
  <text x="74" y="308" font-size="9" font-weight="600" fill="#C9A227">리밸런싱 열기</text>

  <!-- ④ 전체 요약 카드: 총 자산/평가손익/투자원금 + 구성 바 -->
  <rect x="50" y="324" width="260" height="102" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="62" y="344" font-size="10" fill="#948A72">전체</text>
  <text x="62" y="362" font-size="11" fill="#3A3A3A">총 자산</text>
  <text x="298" y="362" text-anchor="end" font-size="11" font-weight="700" fill="#3A3A3A">₩ •••,•••,•••</text>
  <text x="62" y="380" font-size="11" fill="#3A3A3A">평가손익</text>
  <text x="298" y="380" text-anchor="end" font-size="11" font-weight="700" fill="#C0392B">₩ ••,•••,••• (65.5%)</text>
  <text x="62" y="398" font-size="11" fill="#3A3A3A">투자원금</text>
  <text x="298" y="398" text-anchor="end" font-size="11" fill="#948A72">₩ •••,•••,•••</text>
  <rect x="62" y="406" width="66" height="9" rx="4.5" fill="#D95A2B"/>
  <rect x="128" y="406" width="62" height="9" fill="#C9A227"/>
  <rect x="190" y="406" width="40" height="9" fill="#8D6E63"/>
  <rect x="230" y="406" width="34" height="9" fill="#E0C76B"/>
  <rect x="264" y="406" width="20" height="9" fill="#7E57C2"/>
  <rect x="284" y="406" width="14" height="9" rx="4.5" fill="#5C6BC0"/>
  <text x="62" y="441" font-size="8.5" fill="#948A72">갱신 2026.07.26 09:25 · 기준 현재 평가</text>

  <!-- annotations -->
  <g font-size="12.5" fill="#5B5343">
    <text x="370" y="82">① 요약 · 구성 · 수익 · 추정 4개 탭</text>
    <text x="370" y="140">② 투자 건강점수 0~100</text>
    <text x="386" y="158" font-size="11" fill="#948A72">감점·가점 요소와 근거 수치를 함께</text>
    <text x="370" y="270">③ 지금 손볼 것 — 문장 + 바로가기</text>
    <text x="386" y="288" font-size="11" fill="#948A72">최대 3개, 심각한 것부터</text>
    <text x="370" y="368">④ 전체 요약과 자산군 구성 바</text>
    <text x="386" y="386" font-size="11" fill="#948A72">계좌를 골라 범위를 좁힐 수 있다</text>
  </g>
  <line x1="315" y1="76" x2="362" y2="78" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="140" x2="362" y2="136" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="272" x2="362" y2="266" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="370" x2="362" y2="364" stroke="#C9B98A" stroke-width="1.5"/>
</svg>
