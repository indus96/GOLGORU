<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="420" rx="24" fill="#FDF6E3"/>

  <!-- 고정 -->
  <g transform="translate(96 60)">
    <rect width="372" height="300" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="28" y="46" font-size="18" font-weight="800" fill="#3A3A3A">고정</text>
    <text x="344" y="46" text-anchor="end" font-size="12" fill="#948A72">매달 정해진 돈</text>
    <g font-size="13" fill="#3A3A3A">
      <text x="28" y="96">월세 · 관리비</text><text x="344" y="96" text-anchor="end">70만 / 70만</text>
      <rect x="28" y="108" width="316" height="10" rx="5" fill="#8A7F68"/>
      <text x="28" y="158">통신 · 구독</text><text x="344" y="158" text-anchor="end">8만 / 8만</text>
      <rect x="28" y="170" width="316" height="10" rx="5" fill="#8A7F68"/>
      <text x="28" y="220">보험</text><text x="344" y="220" text-anchor="end">12만 / 12만</text>
      <rect x="28" y="232" width="316" height="10" rx="5" fill="#8A7F68"/>
    </g>
    <text x="28" y="276" font-size="12" fill="#948A72">반복으로 걸어 두고 확인만</text>
  </g>

  <!-- 생활 -->
  <g transform="translate(492 60)">
    <rect width="372" height="300" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="28" y="46" font-size="18" font-weight="800" fill="#3A3A3A">생활</text>
    <text x="344" y="46" text-anchor="end" font-size="12" fill="#948A72">금액이 바뀌는 돈</text>
    <g font-size="13" fill="#3A3A3A">
      <text x="28" y="96">식비</text><text x="344" y="96" text-anchor="end">31만 / 45만</text>
      <rect x="28" y="108" width="316" height="10" rx="5" fill="#F1EBDD"/><rect x="28" y="108" width="218" height="10" rx="5" fill="#3A7D52"/>
      <text x="28" y="158">교통</text><text x="344" y="158" text-anchor="end">6만 / 10만</text>
      <rect x="28" y="170" width="316" height="10" rx="5" fill="#F1EBDD"/><rect x="28" y="170" width="190" height="10" rx="5" fill="#3A7D52"/>
      <text x="28" y="220">카페 · 간식</text><text x="344" y="220" text-anchor="end" font-weight="700" fill="#C9772B">5.5만 / 5만</text>
      <rect x="28" y="232" width="316" height="10" rx="5" fill="#E8964A"/>
    </g>
    <text x="28" y="276" font-size="12" fill="#948A72">여기가 진짜 예산 — 넘긴 항목만 봅니다</text>
  </g>
</svg>
