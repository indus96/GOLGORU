<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><rect width="960" height="420" rx="24" fill="#FDF6E3"/><rect x="120" y="70" width="330" height="270" rx="18" fill="#FFF" stroke="#E9E1D2" stroke-width="2"/><text x="146" y="108" font-size="16" fill="#3A3A3A" font-weight="700" text-anchor="start">처방전</text><text x="146" y="146" font-size="13" fill="#948A72" font-weight="400" text-anchor="start">환자 성명</text><text x="424" y="146" font-size="13" fill="#3A3A3A" font-weight="700" text-anchor="end">홍길동</text><text x="146" y="180" font-size="13" fill="#948A72" font-weight="400" text-anchor="start">주민등록번호</text><rect x="300" y="166" width="124" height="20" rx="5" fill="#3A3A3A"/><text x="146" y="214" font-size="13" fill="#948A72" font-weight="400" text-anchor="start">전화번호</text><rect x="320" y="200" width="104" height="20" rx="5" fill="#3A3A3A"/><text x="146" y="248" font-size="13" fill="#948A72" font-weight="400" text-anchor="start">질병분류기호</text><text x="424" y="248" font-size="13" fill="#3A3A3A" font-weight="700" text-anchor="end">M54.5</text><text x="146" y="300" font-size="12" fill="#B4881F" font-weight="400" text-anchor="start">가리기 — 번호가 보이는 칸을 덮습니다</text><g transform="translate(540 90)"><rect width="300" height="230" rx="24" fill="#FFF" stroke="#E9E1D2" stroke-width="2"/><text x="30" y="46" font-size="16" fill="#3A3A3A" font-weight="700" text-anchor="start">사진은 어디에?</text><circle cx="44" cy="90" r="9" fill="#3A7D52"/><text x="64" y="95" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">앱 안에만 보관</text><circle cx="44" cy="130" r="9" fill="#C8BFAE"/><text x="64" y="135" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">사진첩에 안 남음</text><circle cx="44" cy="170" r="9" fill="#C8BFAE"/><text x="64" y="175" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">서버로 안 보냄</text><text x="30" y="210" font-size="12" fill="#948A72" font-weight="400" text-anchor="