<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><rect width="960" height="420" rx="24" fill="#FDF6E3"/><text x="90" y="70" font-size="16" fill="#3A3A3A" font-weight="700" text-anchor="start">클릭을 소리 출력에 직접 — 오래 켜 둬도 밀리지 않게</text><rect x="90" y="100" width="780" height="100" rx="18" fill="#FFF" stroke="#E9E1D2" stroke-width="2"/><text x="114" y="132" font-size="13" fill="#948A72" font-weight="700" text-anchor="start">타이머로 울릴 때</text><line x1="140" y1="150" x2="140" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><line x1="211" y1="150" x2="211" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><line x1="284" y1="150" x2="284" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><line x1="358" y1="150" x2="358" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><line x1="434" y1="150" x2="434" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><line x1="512" y1="150" x2="512" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><line x1="592" y1="150" x2="592" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><line x1="674" y1="150" x2="674" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><line x1="758" y1="150" x2="758" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><line x1="843" y1="150" x2="843" y2="182" stroke="#C8BFAE" stroke-width="5" stroke-linecap="round"/><rect x="90" y="220" width="780" height="100" rx="18" fill="#FFF" stroke-width="2" stroke="#C9A227"/><text x="114" y="252" font-size="13" fill="#B4881F" font-weight="700" text-anchor="start">소리에 샘플 단위로 넣을 때</text><line x1="140" y1="270" x2="140" y2="302" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/><line x1="210" y1="270" x2="210" y2="302" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/><line x1="280" y1="270" x2="280" y2="302" stroke="#C9A227" stroke-width="5"