<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="420" rx="24" fill="#FDF6E3"/>
  <rect x="120" y="54" width="720" height="312" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>

  <text x="156" y="100" font-size="14" font-weight="700" fill="#948A72">이번 달 넣을 돈</text>
  <text x="804" y="102" text-anchor="end" font-size="26" font-weight="800" fill="#3A3A3A">50만 원</text>
  <line x1="156" y1="122" x2="804" y2="122" stroke="#F1EBDD"/>

  <!-- 주식 ETF: 지금 66% → 산 뒤 62.9%, 목표 60% -->
  <text x="156" y="160" font-size="14" font-weight="700" fill="#3A3A3A">주식 ETF</text>
  <text x="804" y="160" text-anchor="end" font-size="13" fill="#948A72">사지 않음</text>
  <rect x="156" y="174" width="648" height="16" rx="8" fill="#F1EBDD"/>
  <rect x="156" y="174" width="407" height="16" rx="8" fill="#C9A227"/>
  <rect x="543" y="168" width="3" height="28" fill="#3A3A3A"/>
  <text x="156" y="214" font-size="12" fill="#6B6350">66% → 63%</text>
  <text x="545" y="214" text-anchor="middle" font-size="11" fill="#948A72">목표 60%</text>

  <!-- 채권 ETF: 지금 34% → 산 뒤 37.1%, 목표 40% -->
  <text x="156" y="262" font-size="14" font-weight="700" fill="#3A3A3A">채권 ETF</text>
  <rect x="712" y="244" width="92" height="26" rx="13" fill="#3A7D52"/>
  <text x="758" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">+50만</text>
  <rect x="156" y="276" width="648" height="16" rx="8" fill="#F1EBDD"/>
  <rect x="156" y="276" width="240" height="16" rx="8" fill="#5B7FA6"/>
  <rect x="376" y="276" width="20" height="16" fill="#3A7D52"/>
  <path d="M388 276 h0 a8 8 0 0 1 8 8 a8 8 0 0 1 -8 8z" fill="#3A7D52"/>
  <rect x="414" y="270" width="3" height="28" fill="#3A3A3A"/>
  <text x="156" y="316" font-size="12" fill="#6B6350">34% → 37%</text>
  <text x="416" y="316" text-anchor="middle" font-size="11" fill="#948A72">목표 40%</text>

  <text x="804" y="344" text-anchor="end" font-size="12" fill="#948A72">팔지 않고, 모자란 쪽만 삽니다</text>
</svg>
