<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="420" rx="24" fill="#FDF6E3"/>
  <rect x="96" y="54" width="768" height="312" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>

  <text x="132" y="96" font-size="14" font-weight="700" fill="#948A72">정류장까지 걸어서 5분</text>

  <!-- 시간 축 -->
  <line x1="132" y1="240" x2="828" y2="240" stroke="#E9E1D2" stroke-width="4" stroke-linecap="round"/>
  <!-- 걷는 구간 0~5분 -->
  <line x1="132" y1="240" x2="390" y2="240" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <circle cx="132" cy="240" r="8" fill="#C9A227"/>
  <text x="132" y="274" text-anchor="middle" font-size="12" fill="#6B6350">지금</text>
  <rect x="386" y="218" width="4" height="44" rx="2" fill="#3A3A3A"/>
  <text x="388" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#3A3A3A">정류장 도착 · 5분</text>

  <!-- 3분 뒤 차: 못 탐 -->
  <g transform="translate(287 180)" opacity=".5">
    <rect x="-34" y="-22" width="68" height="34" rx="10" fill="#F1EBDD"/>
    <text x="0" y="1" text-anchor="middle" font-size="13" font-weight="700" fill="#6B6350">3분 뒤</text>
    <line x1="-40" y1="-5" x2="40" y2="-5" stroke="#948A72" stroke-width="2"/>
    <text x="0" y="-34" text-anchor="middle" font-size="11" fill="#948A72">못 탐 — 뺍니다</text>
  </g>

  <!-- 6분 뒤 차: 뛰면 -->
  <g transform="translate(442 180)">
    <rect x="-40" y="-22" width="80" height="34" rx="10" fill="#FDF6E3" stroke="#C9A227"/>
    <text x="0" y="1" text-anchor="middle" font-size="13" font-weight="700" fill="#B4881F">🏃 6분 뒤</text>
    <text x="0" y="-34" text-anchor="middle" font-size="11" fill="#948A72">뛰면 닿음</text>
    <line x1="0" y1="14" x2="0" y2="52" stroke="#C9A227" stroke-width="2"/>
  </g>

  <!-- 9분 뒤 차: 탈 수 있음 -->
  <g transform="translate(596 180)">
    <rect x="-40" y="-22" width="80" height="34" rx="10" fill="#3A7D52"/>
    <text x="0" y="1" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">9분 뒤</text>
    <text x="0" y="-34" text-anchor="middle" font-size="11" font-weight="700" fill="#3A7D52">이 차를 보여 줍니다</text>
    <line x1="0" y1="14" x2="0" y2="52" stroke="#3A7D52" stroke-width="2"/>
  </g>

  <!-- 17분 뒤 -->
  <g transform="translate(790 180)">
    <rect x="-36" y="-22" width="72" height="34" rx="10" fill="#FAF7F2" stroke="#E9E1D2"/>
    <text x="0" y="1" text-anchor="middle" font-size="13" fill="#6B6350">17분 뒤</text>
    <text x="0" y="-34" text-anchor="middle" font-size="11" fill="#948A72">다음 차</text>
    <line x1="0" y1="14" x2="0" y2="52" stroke="#E9E1D2" stroke-width="2"/>
  </g>

  <text x="132" y="340" font-size="12" fill="#948A72">걷는 시간은 횡단보도 신호까지 넣은 실제 길로 잽니다</text>
</svg>
