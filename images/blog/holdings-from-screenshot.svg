<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="420" rx="24" fill="#FDF6E3"/>

  <!-- 왼쪽: 증권사 앱 보유 종목 -->
  <g transform="translate(96 64)">
    <rect width="270" height="292" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="22" y="38" font-size="11" font-weight="700" fill="#948A72">증권사 앱 · 보유 종목</text>
    <g font-size="10" fill="#948A72"><text x="22" y="66">종목</text><text x="176" y="66" text-anchor="end">수량</text><text x="248" y="66" text-anchor="end">매입가</text></g>
    <g font-size="13" fill="#3A3A3A">
      <text x="22" y="98">미국지수 ETF</text><text x="176" y="98" text-anchor="end">142</text><text x="248" y="98" text-anchor="end">18,240</text>
      <line x1="22" y1="114" x2="248" y2="114" stroke="#F1EBDD"/>
      <text x="22" y="142">국내지수 ETF</text><text x="176" y="142" text-anchor="end">60</text><text x="248" y="142" text-anchor="end">34,150</text>
      <line x1="22" y1="158" x2="248" y2="158" stroke="#F1EBDD"/>
      <text x="22" y="186">채권 ETF</text><text x="176" y="186" text-anchor="end">85</text><text x="248" y="186" text-anchor="end">10,920</text>
      <line x1="22" y1="202" x2="248" y2="202" stroke="#F1EBDD"/>
      <text x="22" y="230">금 ETF</text><text x="176" y="230" text-anchor="end">30</text><text x="248" y="230" text-anchor="end">15,600</text>
    </g>
    <g fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round">
      <path d="M-10 14 V-10 H14"/><path d="M256 -10 H280 V14"/>
      <path d="M-10 278 V302 H14"/><path d="M256 302 H280 V278"/>
    </g>
  </g>

  <g transform="translate(484 210)">
    <line x1="-72" y1="0" x2="58" y2="0" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
    <path d="M54 -9 L68 0 L54 9" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-50" y="-52" width="100" height="30" rx="15" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="0" y="-32" text-anchor="middle" font-size="12" font-weight="700" fill="#B4881F">붙여넣기</text>
  </g>

  <!-- 오른쪽: 골고루 계좌 -->
  <g transform="translate(600 64)">
    <rect width="270" height="292" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="22" y="38" font-size="11" font-weight="700" fill="#948A72">골고루 · 연금저축 계좌</text>
    <!-- 비중 띠 -->
    <rect x="22" y="56" width="226" height="14" rx="7" fill="#E3DCCB"/>
    <path d="M29 56 h83 v14 h-83 a7 7 0 0 1 0 -14z" fill="#C9A227"/>
    <rect x="112" y="56" width="68" height="14" fill="#3A7D52"/>
    <rect x="180" y="56" width="42" height="14" fill="#5B7FA6"/>
    <g font-size="13" fill="#3A3A3A">
      <circle cx="28" cy="100" r="5" fill="#C9A227"/><text x="42" y="105">미국지수 ETF</text><text x="248" y="105" text-anchor="end" font-weight="700">40%</text>
      <circle cx="28" cy="140" r="5" fill="#3A7D52"/><text x="42" y="145">국내지수 ETF</text><text x="248" y="145" text-anchor="end" font-weight="700">30%</text>
      <circle cx="28" cy="180" r="5" fill="#5B7FA6"/><text x="42" y="185">채권 ETF</text><text x="248" y="185" text-anchor="end" font-weight="700">18%</text>
      <circle cx="28" cy="220" r="5" fill="#E3DCCB"/><text x="42" y="225">금 ETF</text><text x="248" y="225" text-anchor="end" font-weight="700">12%</text>
    </g>
    <text x="22" y="266" font-size="11" fill="#948A72">시세가 붙으면 비중은 앱이 계산합니다</text>
  </g>
</svg>
