<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="760" height="300" rx="20" fill="#FFFFFF" stroke="#E9E1D2"/>

  <!-- 캡처 1 -->
  <g transform="translate(40 34)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#948A72">캡처 1</text>
    <rect y="12" width="190" height="210" rx="14" fill="#FAF7F2" stroke="#E9E1D2"/>
    <g font-size="12" fill="#3A3A3A">
      <text x="14" y="44">동네마트</text><text x="176" y="44" text-anchor="end">32,400</text>
      <text x="14" y="80">커피집</text><text x="176" y="80" text-anchor="end">4,800</text>
      <text x="14" y="116">주유소</text><text x="176" y="116" text-anchor="end">50,000</text>
    </g>
    <rect x="6" y="136" width="178" height="78" rx="10" fill="#FDF6E3" stroke="#C9A227" stroke-dasharray="4 4"/>
    <g font-size="12" fill="#3A3A3A">
      <text x="14" y="160">점심 백반</text><text x="176" y="160" text-anchor="end">9,000</text>
      <text x="14" y="196">편의점</text><text x="176" y="196" text-anchor="end">3,200</text>
    </g>
  </g>

  <!-- 캡처 2 -->
  <g transform="translate(270 34)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#948A72">캡처 2</text>
    <rect y="12" width="190" height="210" rx="14" fill="#FAF7F2" stroke="#E9E1D2"/>
    <rect x="6" y="20" width="178" height="78" rx="10" fill="#FDF6E3" stroke="#C9A227" stroke-dasharray="4 4"/>
    <g font-size="12" fill="#3A3A3A">
      <text x="14" y="44">점심 백반</text><text x="176" y="44" text-anchor="end">9,000</text>
      <text x="14" y="80">편의점</text><text x="176" y="80" text-anchor="end">3,200</text>
      <text x="14" y="124">서점</text><text x="176" y="124" text-anchor="end">16,800</text>
      <text x="14" y="160">택시</text><text x="176" y="160" text-anchor="end">7,400</text>
      <text x="14" y="196">빵집</text><text x="176" y="196" text-anchor="end">6,500</text>
    </g>
  </g>

  <!-- 결과 -->
  <g transform="translate(500 34)">
    <path d="M-22 118 h10" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
    <path d="M-14 110 l8 8 -8 8" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="14" y="0" font-size="11" font-weight="700" fill="#B4881F">가계부에는</text>
    <rect x="14" y="12" width="206" height="210" rx="14" fill="#FDF6E3"/>
    <text x="117" y="104" text-anchor="middle" font-size="44" font-weight="800" fill="#C9A227">8줄</text>
    <text x="117" y="134" text-anchor="middle" font-size="12" fill="#6B6350">10줄을 찍었지만</text>
    <text x="117" y="152" text-anchor="middle" font-size="12" fill="#6B6350">겹친 2줄은 한 번만</text>
  </g>

  <text x="40" y="278" font-size="11" fill="#948A72">점선 칸 — 두 장에 겹쳐 찍힌 줄</text>
</svg>
