<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="420" rx="24" fill="#FDF6E3"/>
  <rect x="96" y="54" width="768" height="312" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>

  <text x="128" y="98" font-size="14" font-weight="700" fill="#948A72">같은 지수, 세 가지 판</text>
  <rect x="716" y="78" width="120" height="28" rx="14" fill="#FDF6E3"/>
  <text x="776" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#B4881F">아직 내 자산에 없음</text>

  <!-- 열 머리 -->
  <g font-size="14" font-weight="800" fill="#3A3A3A">
    <text x="420" y="150" text-anchor="middle">A 운용사</text>
    <text x="590" y="150" text-anchor="middle">B 운용사</text>
    <text x="760" y="150" text-anchor="middle">C 운용사</text>
  </g>
  <g font-size="11" font-weight="700">
    <rect x="556" y="160" width="68" height="22" rx="11" fill="#EAF1F7"/><text x="590" y="175" text-anchor="middle" fill="#5B7FA6">환헤지</text>
    <rect x="722" y="160" width="76" height="22" rx="11" fill="#EDF5EF"/><text x="760" y="175" text-anchor="middle" fill="#3A7D52">커버드콜</text>
  </g>

  <!-- 행 -->
  <g font-size="13" fill="#6B6350">
    <line x1="128" y1="200" x2="832" y2="200" stroke="#F1EBDD"/>
    <text x="128" y="232">총보수</text>
    <text x="420" y="232" text-anchor="middle" font-weight="700" fill="#3A3A3A">0.07%</text>
    <text x="590" y="232" text-anchor="middle" font-weight="700" fill="#3A3A3A">0.09%</text>
    <text x="760" y="232" text-anchor="middle" font-weight="700" fill="#3A3A3A">0.39%</text>
    <line x1="128" y1="252" x2="832" y2="252" stroke="#F1EBDD"/>
    <text x="128" y="284">분배</text>
    <text x="420" y="284" text-anchor="middle" font-weight="700" fill="#3A3A3A">분기</text>
    <text x="590" y="284" text-anchor="middle" font-weight="700" fill="#3A3A3A">분기</text>
    <text x="760" y="284" text-anchor="middle" font-weight="700" fill="#3A3A3A">매달</text>
    <line x1="128" y1="304" x2="832" y2="304" stroke="#F1EBDD"/>
    <text x="128" y="336">환율 영향</text>
    <text x="420" y="336" text-anchor="middle" font-weight="700" fill="#3A3A3A">받음</text>
    <text x="590" y="336" text-anchor="middle" font-weight="700" fill="#3A3A3A">상쇄</text>
    <text x="760" y="336" text-anchor="middle" font-weight="700" fill="#3A3A3A">받음</text>
  </g>
</svg>
