<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="420" rx="24" fill="#FDF6E3"/>
  <text x="96" y="72" font-size="14" font-weight="700" fill="#948A72">지금 8:12 · 회사 방향</text>

  <!-- 버스 -->
  <g transform="translate(96 96)">
    <rect width="240" height="250" rx="22" fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/>
    <text x="24" y="44" font-size="15" font-weight="700" fill="#3A3A3A">버스</text>
    <rect x="150" y="22" width="68" height="30" rx="15" fill="#C9A227"/>
    <text x="184" y="42" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">8:41</text>
    <text x="24" y="126" font-size="52" font-weight="800" fill="#3A3A3A">4<tspan font-size="20" font-weight="700" fill="#6B6350"> 분 뒤</tspan></text>
    <text x="24" y="160" font-size="13" fill="#6B6350">302번 · 정류장까지 걸어서 3분</text>
    <rect x="24" y="190" width="192" height="36" rx="10" fill="#FAF7F2"/>
    <text x="38" y="213" font-size="12" fill="#948A72">다음 차 11분 뒤</text>
  </g>

  <!-- 따릉이 -->
  <g transform="translate(360 96)">
    <rect width="240" height="250" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="24" y="44" font-size="15" font-weight="700" fill="#3A3A3A">따릉이</text>
    <rect x="150" y="22" width="68" height="30" rx="15" fill="#FAF7F2" stroke="#E9E1D2"/>
    <text x="184" y="42" text-anchor="middle" font-size="14" font-weight="800" fill="#3A3A3A">8:44</text>
    <text x="24" y="126" font-size="52" font-weight="800" fill="#3A7D52">6<tspan font-size="20" font-weight="700" fill="#6B6350"> 대 남음</tspan></text>
    <text x="24" y="160" font-size="13" fill="#6B6350">대여소까지 걸어서 2분</text>
    <rect x="24" y="190" width="192" height="36" rx="10" fill="#FAF7F2"/>
    <text x="38" y="213" font-size="12" fill="#948A72">역까지 자전거로 9분</text>
  </g>

  <!-- 걷기 -->
  <g transform="translate(624 96)">
    <rect width="240" height="250" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="24" y="44" font-size="15" font-weight="700" fill="#3A3A3A">걷기</text>
    <rect x="150" y="22" width="68" height="30" rx="15" fill="#FAF7F2" stroke="#E9E1D2"/>
    <text x="184" y="42" text-anchor="middle" font-size="14" font-weight="800" fill="#3A3A3A">8:52</text>
    <text x="24" y="126" font-size="52" font-weight="800" fill="#3A3A3A">19<tspan font-size="20" font-weight="700" fill="#6B6350"> 분</tspan></text>
    <text x="24" y="160" font-size="13" fill="#6B6350">역까지 1.3km</text>
    <rect x="24" y="190" width="192" height="36" rx="10" fill="#FAF7F2"/>
    <text x="38" y="213" font-size="12" fill="#948A72">횡단보도 신호 포함</text>
  </g>

  <text x="864" y="384" text-anchor="end" font-size="12" fill="#948A72">오른쪽 위 시각 = 목적지에 닿는 시각</text>
</svg>
