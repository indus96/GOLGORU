<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="420" rx="24" fill="#FDF6E3"/>

  <!-- 왼쪽: 카드사 앱 이용내역 캡처 -->
  <g transform="translate(96 54)">
    <rect width="260" height="312" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="22" y="38" font-size="11" font-weight="700" fill="#948A72">카드사 앱 · 이용내역</text>
    <g font-size="13" fill="#3A3A3A">
      <text x="22" y="76" font-size="10" fill="#948A72">11. 12 (목)</text>
      <text x="22" y="100">동네마트</text><text x="238" y="100" text-anchor="end" font-weight="700">32,400원</text>
      <line x1="22" y1="114" x2="238" y2="114" stroke="#F1EBDD"/>
      <text x="22" y="138">커피집</text><text x="238" y="138" text-anchor="end" font-weight="700">4,800원</text>
      <text x="22" y="176" font-size="10" fill="#948A72">11. 11 (수)</text>
      <text x="22" y="200">주유소</text><text x="238" y="200" text-anchor="end" font-weight="700">50,000원</text>
      <line x1="22" y1="214" x2="238" y2="214" stroke="#F1EBDD"/>
      <text x="22" y="238">점심 백반</text><text x="238" y="238" text-anchor="end" font-weight="700">9,000원</text>
      <line x1="22" y1="252" x2="238" y2="252" stroke="#F1EBDD"/>
      <text x="22" y="276">통신요금</text><text x="238" y="276" text-anchor="end" font-weight="700">45,000원</text>
    </g>
    <!-- 캡처 모서리 표시 -->
    <g fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round">
      <path d="M-10 14 V-10 H14"/><path d="M246 -10 H270 V14"/>
      <path d="M-10 298 V322 H14"/><path d="M246 322 H270 V298"/>
    </g>
  </g>

  <!-- 가운데: 기기 안에서 읽기 -->
  <g transform="translate(480 210)">
    <line x1="-78" y1="0" x2="62" y2="0" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
    <path d="M58 -9 L72 0 L58 9" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-62" y="-52" width="124" height="30" rx="15" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="0" y="-32" text-anchor="middle" font-size="12" font-weight="700" fill="#B4881F">기기 안에서 읽기</text>
    <text x="0" y="34" text-anchor="middle" font-size="11" fill="#948A72">이미지는 보내지 않습니다</text>
  </g>

  <!-- 오른쪽: 골고루 확인 목록 -->
  <g transform="translate(604 54)">
    <rect width="260" height="312" rx="22" fill="#FFFFFF" stroke="#E9E1D2"/>
    <text x="22" y="38" font-size="11" font-weight="700" fill="#948A72">골고루 가계부 · 읽은 줄 5개</text>
    <g font-size="13" fill="#3A3A3A">
      <g transform="translate(0 62)">
        <rect x="22" y="0" width="30" height="18" rx="9" fill="#C9A227"/><circle cx="43" cy="9" r="7" fill="#FFFFFF"/>
        <text x="62" y="14">동네마트</text>
        <rect x="170" y="-2" width="68" height="22" rx="11" fill="#FDF6E3"/><text x="204" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="#B4881F">식비</text>
      </g>
      <g transform="translate(0 104)">
        <rect x="22" y="0" width="30" height="18" rx="9" fill="#C9A227"/><circle cx="43" cy="9" r="7" fill="#FFFFFF"/>
        <text x="62" y="14">커피집</text>
        <rect x="170" y="-2" width="68" height="22" rx="11" fill="#FDF6E3"/><text x="204" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="#B4881F">카페·간식</text>
      </g>
      <g transform="translate(0 146)">
        <rect x="22" y="0" width="30" height="18" rx="9" fill="#C9A227"/><circle cx="43" cy="9" r="7" fill="#FFFFFF"/>
        <text x="62" y="14">주유소</text>
        <rect x="170" y="-2" width="68" height="22" rx="11" fill="#FDF6E3"/><text x="204" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="#B4881F">교통</text>
      </g>
      <g transform="translate(0 188)">
        <rect x="22" y="0" width="30" height="18" rx="9" fill="#C9A227"/><circle cx="43" cy="9" r="7" fill="#FFFFFF"/>
        <text x="62" y="14">점심 백반</text>
        <rect x="170" y="-2" width="68" height="22" rx="11" fill="#FDF6E3"/><text x="204" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="#B4881F">외식</text>
      </g>
      <g transform="translate(0 230)" opacity=".55">
        <rect x="22" y="0" width="30" height="18" rx="9" fill="#E3DCCB"/><circle cx="31" cy="9" r="7" fill="#FFFFFF"/>
        <text x="62" y="14">통신요금</text>
        <text x="238" y="13" text-anchor="end" font-size="10" fill="#948A72">이미 적음</text>
      </g>
    </g>
    <rect x="22" y="266" width="216" height="30" rx="12" fill="#C9A227"/>
    <text x="130" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4개 저장</text>
  </g>
</svg>
