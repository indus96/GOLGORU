<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"><rect width="960" height="420" rx="24" fill="#FDF6E3"/><rect x="100" y="70" width="760" height="120" rx="18" fill="#FFF" stroke="#E9E1D2" stroke-width="2"/><text x="130" y="108" font-size="15" fill="#3A3A3A" font-weight="700" text-anchor="start">올해 의료비 한도</text><text x="830" y="108" font-size="13" fill="#948A72" font-weight="400" text-anchor="end">근속 연수로 정해짐</text><rect x="130" y="128" width="700" height="22" rx="11" fill="#F4F1EA"/><rect x="130" y="128" width="238" height="22" rx="11" fill="#C9A227"/><text x="130" y="176" font-size="13" fill="#B4881F" font-weight="700" text-anchor="start">청구한 금액 170만원</text><text x="830" y="176" font-size="13" fill="#6B6350" font-weight="400" text-anchor="end">남은 한도 330만원 / 500만원</text><rect x="100" y="220" width="360" height="120" rx="18" fill="#FFF" stroke="#E9E1D2" stroke-width="2"/><text x="130" y="256" font-size="15" fill="#3A3A3A" font-weight="700" text-anchor="start">설정</text><text x="130" y="290" font-size="14" fill="#6B6350" font-weight="400" text-anchor="start">사번 · 성명 · 입사일</text><text x="130" y="320" font-size="12" fill="#948A72" font-weight="400" text-anchor="start">입사일로 한도를 고릅니다</text><rect x="500" y="220" width="360" height="120" rx="18" fill="#FFF" stroke="#E9E1D2" stroke-width="2"/><text x="530" y="256" font-size="15" fill="#3A3A3A" font-weight="700" text-anchor="start">다음 할 일</text><text x="530" y="290" font-size="14" fill="#6B6350" font-weight="400" text-anchor="start">• 빈 값 2개 채우기</text><text x="530" y="318" font-size="14" fill="#6B6350" font-weight="400" text-anchor="start">• 주민번호 가리기 1장</text><text x="480" y="384" font-size="12" fill="#948A72" font-weight="400" text-anchor="middle">금액은 예시 · 한도 규칙은 회사마다 다릅니다</text></svg>
