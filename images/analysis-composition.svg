<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="720" height="476" fill="#FAF7F2"/>
  <rect x="30" y="20" width="300" height="436" rx="24" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="50" y="54" font-size="16" font-weight="800" fill="#3A3A3A">자산 구성 분석</text>

  <!-- 세그먼트: 구성 선택 -->
  <rect x="50" y="64" width="260" height="24" rx="12" fill="#F2EDE0"/>
  <rect x="117" y="66" width="62" height="20" rx="10" fill="#FFFFFF" stroke="#E3DCCF"/>
  <text x="83" y="80" text-anchor="middle" font-size="10" fill="#8A7B4F">요약</text>
  <text x="147" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#3A3A3A">구성</text>
  <text x="212" y="80" text-anchor="middle" font-size="10" fill="#8A7B4F">수익</text>
  <text x="277" y="80" text-anchor="middle" font-size="10" fill="#8A7B4F">추정</text>

  <!-- ① 집중도 카드 -->
  <rect x="50" y="98" width="260" height="128" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="62" y="118" font-size="11" font-weight="700" fill="#3A3A3A">집중도</text>
  <text x="62" y="133" font-size="8.5" fill="#948A72">가장 큰 종목 몇 개가 자산에서 차지하는 비중</text>
  <text x="62" y="150" font-size="9" fill="#948A72">상위 1종목</text>
  <text x="62" y="168" font-size="14" font-weight="800" fill="#3A3A3A">74%</text>
  <text x="148" y="150" font-size="9" fill="#948A72">상위 5종목</text>
  <text x="148" y="168" font-size="14" font-weight="800" fill="#3A3A3A">100%</text>
  <text x="234" y="150" font-size="9" fill="#948A72">상위 10종목</text>
  <text x="234" y="168" font-size="14" font-weight="800" fill="#3A3A3A">100%</text>
  <line x1="62" y1="178" x2="298" y2="178" stroke="#EEE7D8"/>
  <text x="62" y="196" font-size="10" fill="#3A3A3A">실질 분산</text>
  <text x="298" y="196" text-anchor="end" font-size="10" font-weight="700" fill="#3A3A3A">1.7종목</text>
  <text x="62" y="214" font-size="10" fill="#3A3A3A">가장 큰 종목</text>
  <text x="298" y="214" text-anchor="end" font-size="10" font-weight="700" fill="#3A3A3A">SK하이닉스  74%</text>

  <!-- ② 노출·분산 카드 — 통화/국가/산업 도넛 3개 -->
  <rect x="50" y="236" width="260" height="140" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="62" y="256" font-size="11" font-weight="700" fill="#3A3A3A">노출·분산</text>
  <!-- 도넛: stroke-dasharray 로 74/26 -->
  <text x="94" y="272" text-anchor="middle" font-size="9" fill="#948A72">통화</text>
  <circle cx="94" cy="300" r="20" fill="none" stroke="#F29940" stroke-width="9"
          stroke-dasharray="93 33" transform="rotate(-90 94 300)"/>
  <circle cx="94" cy="300" r="20" fill="none" stroke="#D95A2B" stroke-width="9"
          stroke-dasharray="33 93" stroke-dashoffset="-93" transform="rotate(-90 94 300)"/>
  <text x="94" y="304" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3A3A3A">74%</text>
  <text x="180" y="272" text-anchor="middle" font-size="9" fill="#948A72">국가</text>
  <circle cx="180" cy="300" r="20" fill="none" stroke="#F29940" stroke-width="9"
          stroke-dasharray="93 33" transform="rotate(-90 180 300)"/>
  <circle cx="180" cy="300" r="20" fill="none" stroke="#D95A2B" stroke-width="9"
          stroke-dasharray="33 93" stroke-dashoffset="-93" transform="rotate(-90 180 300)"/>
  <text x="180" y="304" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3A3A3A">74%</text>
  <text x="266" y="272" text-anchor="middle" font-size="9" fill="#948A72">산업</text>
  <circle cx="266" cy="300" r="20" fill="none" stroke="#F29940" stroke-width="9"
          stroke-dasharray="93 33" transform="rotate(-90 266 300)"/>
  <circle cx="266" cy="300" r="20" fill="none" stroke="#D95A2B" stroke-width="9"
          stroke-dasharray="24 102" stroke-dashoffset="-93" transform="rotate(-90 266 300)"/>
  <circle cx="266" cy="300" r="20" fill="none" stroke="#C9B45C" stroke-width="9"
          stroke-dasharray="9 117" stroke-dashoffset="-117" transform="rotate(-90 266 300)"/>
  <text x="266" y="304" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3A3A3A">74%</text>
  <circle cx="70" cy="332" r="3" fill="#F29940"/><text x="77" y="336" font-size="9" fill="#3A3A3A">원화 74%</text>
  <circle cx="134" cy="332" r="3" fill="#D95A2B"/><text x="141" y="336" font-size="9" fill="#3A3A3A">달러 26%</text>
  <circle cx="198" cy="332" r="3" fill="#F29940"/><text x="205" y="336" font-size="9" fill="#3A3A3A">반도체 74%</text>
  <text x="62" y="356" font-size="9" fill="#948A72">목표 편차  <tspan font-weight="700" fill="#E5820C">5%p 이상 4개 · 최대 SK하이닉스 −55.0%p</tspan></text>
  <text x="62" y="369" font-size="8" fill="#B8B0A0">산업은 개별주식 기준 · ETF·펀드는 내부 구성을 알 수 없어 제외</text>

  <!-- ③ 배당 카드 -->
  <rect x="50" y="386" width="260" height="58" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="62" y="406" font-size="11" font-weight="700" fill="#3A3A3A">배당</text>
  <text x="62" y="424" font-size="10" fill="#3A3A3A">연 배당</text>
  <text x="298" y="424" text-anchor="end" font-size="11" font-weight="700" fill="#3A3A3A">₩ ••,•••</text>
  <text x="62" y="438" font-size="10" fill="#3A3A3A">배당수익률</text>
  <text x="298" y="438" text-anchor="end" font-size="10" fill="#3A3A3A">0.2%</text>

  <!-- annotations -->
  <g font-size="12.5" fill="#5B5343">
    <text x="370" y="130">① 집중도 — 상위 종목 쏠림</text>
    <text x="386" y="148" font-size="11" fill="#948A72">현금·저축·부동산 제외, 실질 분산 종목 수</text>
    <text x="370" y="290">② 통화 · 국가 · 산업 노출</text>
    <text x="386" y="308" font-size="11" fill="#948A72">목표와 벌어진 항목은 주황으로 경고</text>
    <text x="370" y="416">③ 배당 — 지난 1년 실지급 기준</text>
    <text x="386" y="434" font-size="11" fill="#948A72">종목별 내역과 커버리지 표시</text>
  </g>
  <line x1="315" y1="128" x2="362" y2="126" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="292" x2="362" y2="286" stroke="#C9B98A" stroke-width="1.5"/>
  <line x1="315" y1="414" x2="362" y2="412" stroke="#C9B98A" stroke-width="1.5"/>
</svg>
