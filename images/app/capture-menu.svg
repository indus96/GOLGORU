<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="320" height="620" fill="#FAF7F2"/>

  <!-- 상단 바 -->
  <text x="20" y="42" font-size="11" fill="#948A72">‹ 설정</text>
  <text x="20" y="76" font-size="21" font-weight="800" fill="#3A3A3A">원장 편집</text>

  <!-- 계좌 카드 -->
  <text x="22" y="112" font-size="11" font-weight="700" fill="#948A72">연금저축</text>
  <rect x="16" y="122" width="288" height="150" rx="14" fill="#FFFFFF" stroke="#EEE7D8"/>

  <g>
    <rect x="30" y="136" width="30" height="30" rx="8" fill="#EFF3F8"/>
    <text x="45" y="156" text-anchor="middle" font-size="12">📊</text>
    <text x="68" y="150" font-size="12" font-weight="700" fill="#3A3A3A">TIGER 미국S&amp;P500</text>
    <text x="68" y="165" font-size="10" fill="#948A72">142주 · 18,240원</text>
    <text x="290" y="157" text-anchor="end" font-size="11" font-weight="700" fill="#3A3A3A">₩2,590,080</text>
  </g>
  <line x1="30" y1="180" x2="290" y2="180" stroke="#EEE7D8"/>
  <g>
    <rect x="30" y="192" width="30" height="30" rx="8" fill="#F6E7E7"/>
    <text x="45" y="212" text-anchor="middle" font-size="12">📈</text>
    <text x="68" y="206" font-size="12" font-weight="700" fill="#3A3A3A">KODEX 200TR</text>
    <text x="68" y="221" font-size="10" fill="#948A72">100주 · 14,870원</text>
    <text x="290" y="213" text-anchor="end" font-size="11" font-weight="700" fill="#3A3A3A">₩1,487,000</text>
  </g>
  <line x1="30" y1="236" x2="290" y2="236" stroke="#EEE7D8"/>
  <g>
    <text x="30" y="257" font-size="11" fill="#6B6350">현금</text>
    <text x="290" y="257" text-anchor="end" font-size="11" fill="#6B6350">₩310,000</text>
  </g>

  <!-- 동작 목록 -->
  <rect x="16" y="288" width="288" height="152" rx="14" fill="#FFFFFF" stroke="#EEE7D8"/>

  <g>
    <text x="34" y="320" font-size="13" fill="#C9A227">＋</text>
    <text x="58" y="320" font-size="12.5" fill="#3A3A3A">종목 추가</text>
  </g>
  <line x1="30" y1="336" x2="290" y2="336" stroke="#EEE7D8"/>

  <!-- 이 화면의 주인공 — 금색 배경으로 눈이 먼저 가게 한다 -->
  <rect x="22" y="342" width="276" height="44" rx="10" fill="#FDF6E3"/>
  <g>
    <text x="34" y="370" font-size="13" fill="#C9A227">▣</text>
    <text x="58" y="370" font-size="12.5" font-weight="700" fill="#3A3A3A">캡처로 종목 가져오기</text>
    <text x="288" y="370" text-anchor="end" font-size="11" fill="#C9B98A">›</text>
  </g>
  <line x1="30" y1="396" x2="290" y2="396" stroke="#EEE7D8"/>

  <g>
    <text x="34" y="422" font-size="13" fill="#C9A227">⚙</text>
    <text x="58" y="422" font-size="12.5" fill="#3A3A3A">계좌 편집</text>
    <text x="288" y="422" text-anchor="end" font-size="11" fill="#C9B98A">›</text>
  </g>

  <text x="26" y="556" font-size="10" fill="#948A72">한 종목씩 입력하는 대신, 증권사 앱 화면을</text>
  <text x="26" y="572" font-size="10" fill="#948A72">캡처해 붙여넣으면 한 번에 채워집니다.</text>
</svg>
