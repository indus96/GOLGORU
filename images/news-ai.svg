<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="860" height="340" fill="#FAF7F2"/>

  <!-- 왼쪽 폰: 뉴스 — 세그먼트(뉴스/리포트) + 종목 칩 + 기사 -->
  <rect x="30" y="20" width="300" height="300" rx="24" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="50" y="52" font-size="16" font-weight="800" fill="#3A3A3A">뉴스</text>
  <rect x="50" y="62" width="260" height="24" rx="12" fill="#F2EDE0"/>
  <rect x="52" y="64" width="126" height="20" rx="10" fill="#FFFFFF" stroke="#E3DCCF"/>
  <text x="115" y="78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3A3A3A">뉴스</text>
  <text x="245" y="78" text-anchor="middle" font-size="10.5" fill="#8A7B4F">리포트</text>
  <!-- 종목 칩: 전체(골드) + 보유 종목 -->
  <rect x="50" y="94" width="38" height="20" rx="10" fill="#F5EBD4"/>
  <text x="69" y="108" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8A6D1F">전체</text>
  <rect x="92" y="94" width="70" height="20" rx="10" fill="#F2EDE0"/>
  <text x="127" y="108" text-anchor="middle" font-size="9.5" fill="#8A7B4F">SK하이닉스</text>
  <rect x="166" y="94" width="50" height="20" rx="10" fill="#F2EDE0"/>
  <text x="191" y="108" text-anchor="middle" font-size="9.5" fill="#8A7B4F">테슬라</text>
  <!-- 기사 행 -->
  <rect x="50" y="124" width="260" height="54" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="62" y="144" font-size="11" font-weight="600" fill="#3A3A3A">반도체 업황 회복세 — 메모리 가격</text>
  <text x="62" y="159" font-size="11" font-weight="600" fill="#3A3A3A">상승 지속 전망</text>
  <text x="62" y="172" font-size="9" fill="#948A72">연합뉴스 · 2시간 전 · SK하이닉스</text>
  <rect x="50" y="184" width="260" height="54" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="62" y="204" font-size="11" font-weight="600" fill="#3A3A3A">환율 변동성 확대 — 해외 자산</text>
  <text x="62" y="219" font-size="11" font-weight="600" fill="#3A3A3A">평가액 영향은</text>
  <text x="62" y="232" font-size="9" fill="#948A72">한국경제 · 4시간 전 · 거시</text>
  <rect x="50" y="244" width="260" height="54" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="62" y="264" font-size="11" font-weight="600" fill="#3A3A3A">전기차 수요 둔화 속 가격 인하</text>
  <text x="62" y="279" font-size="11" font-weight="600" fill="#3A3A3A">경쟁 재점화</text>
  <text x="62" y="292" font-size="9" fill="#948A72">로이터 · 6시간 전 · 테슬라</text>

  <!-- 오른쪽 폰: AI점검 — 성향 세그먼트 + 현재 분석 바 + 진단 별점 -->
  <rect x="360" y="20" width="300" height="300" rx="24" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="380" y="52" font-size="16" font-weight="800" fill="#3A3A3A">AI점검</text>
  <!-- AI 자산 진단 카드 -->
  <rect x="380" y="62" width="260" height="64" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="392" y="80" font-size="11" font-weight="700" fill="#3A3A3A">🩺 AI 자산 진단</text>
  <text x="628" y="80" text-anchor="end" font-size="8.5" fill="#948A72">입력 없이 자동 분석</text>
  <rect x="392" y="88" width="236" height="22" rx="11" fill="#F2EDE0"/>
  <rect x="470" y="90" width="80" height="18" rx="9" fill="#FFFFFF" stroke="#E3DCCF"/>
  <text x="431" y="103" text-anchor="middle" font-size="9.5" fill="#8A7B4F">안정형</text>
  <text x="510" y="103" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3A3A3A">중립형</text>
  <text x="589" y="103" text-anchor="middle" font-size="9.5" fill="#8A7B4F">공격형</text>
  <text x="392" y="121" font-size="8.5" fill="#948A72">균형 — 위험·방어 자산을 고르게</text>

  <!-- 현재 분석 -->
  <rect x="380" y="134" width="260" height="96" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="392" y="152" font-size="11" font-weight="700" fill="#3A3A3A">현재 분석</text>
  <circle cx="398" cy="166" r="3.5" fill="#B0A892"/>
  <text x="406" y="170" font-size="10" fill="#3A3A3A">현금</text>
  <rect x="440" y="161" width="140" height="8" rx="4" fill="#F0EBDD"/>
  <rect x="440" y="161" width="35" height="8" rx="4" fill="#B0A892"/>
  <text x="628" y="170" text-anchor="end" font-size="10" font-weight="600" fill="#3A3A3A">24.7%</text>
  <circle cx="398" cy="184" r="3.5" fill="#5C6BC0"/>
  <text x="406" y="188" font-size="10" fill="#3A3A3A">채권</text>
  <rect x="440" y="179" width="140" height="8" rx="4" fill="#F0EBDD"/>
  <text x="628" y="188" text-anchor="end" font-size="10" font-weight="600" fill="#3A3A3A">0%</text>
  <circle cx="398" cy="202" r="3.5" fill="#F29940"/>
  <text x="406" y="206" font-size="10" fill="#3A3A3A">주식</text>
  <rect x="440" y="197" width="140" height="8" rx="4" fill="#F0EBDD"/>
  <rect x="440" y="197" width="106" height="8" rx="4" fill="#F29940"/>
  <text x="628" y="206" text-anchor="end" font-size="10" font-weight="600" fill="#3A3A3A">75.3%</text>
  <text x="392" y="223" font-size="8.5" fill="#948A72">주식 · 국가 — 미국 0% · 기타 49.4% · 한국 25.9%</text>

  <!-- 편중·부족 진단 -->
  <rect x="380" y="238" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#EEE7D8"/>
  <text x="392" y="256" font-size="11" font-weight="700" fill="#3A3A3A">⚠️ 편중·부족 진단</text>
  <text x="392" y="274" font-size="10" fill="#3A3A3A">현금</text>
  <rect x="424" y="268" width="90" height="7" rx="3.5" fill="#F29940"/>
  <text x="524" y="275" font-size="9" fill="#E5A03C">★★★☆☆</text>
  <text x="628" y="275" text-anchor="end" font-size="9" fill="#948A72">현금 과다</text>
  <text x="392" y="292" font-size="10" fill="#3A3A3A">채권</text>
  <rect x="424" y="286" width="120" height="7" rx="3.5" fill="#E05252"/>
  <text x="524" y="293" font-size="9" fill="#E05252">★★★★☆</text>
  <text x="628" y="293" text-anchor="end" font-size="9" fill="#948A72">채권 하한 미달</text>

  <!-- 하단 캡션 -->
  <text x="180" y="334" text-anchor="middle" font-size="10" fill="#948A72">보유·관심 종목별 뉴스 필터</text>
  <text x="510" y="334" text-anchor="middle" font-size="10" fill="#948A72">성향별 진단 → AI 목표 제안 → 리밸런싱</text>
</svg>
