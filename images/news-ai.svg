<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect width="860" height="340" fill="#FAF7F2"/>

  <!-- news panel -->
  <rect x="40" y="30" width="380" height="280" rx="20" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="230" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#3A3A3A">뉴스 · 리포트</text>
  <rect x="60" y="78" width="66" height="24" rx="12" fill="#C9A227"/>
  <text x="93" y="94" text-anchor="middle" font-size="10.5" font-weight="600" fill="#FFF">전체</text>
  <rect x="132" y="78" width="86" height="24" rx="12" fill="#F2EDE0"/>
  <text x="175" y="94" text-anchor="middle" font-size="10.5" fill="#8A7B4F">보유 종목</text>
  <rect x="224" y="78" width="86" height="24" rx="12" fill="#F2EDE0"/>
  <text x="267" y="94" text-anchor="middle" font-size="10.5" fill="#8A7B4F">리포트</text>

  <rect x="60" y="114" width="340" height="52" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="74" y="136" font-size="12" fill="#3A3A3A">시장 금리와 환율 점검</text>
  <text x="74" y="154" font-size="10" fill="#999">관련 종목: 글로벌 인덱스 ETF · 현금성 자산</text>

  <rect x="60" y="172" width="340" height="52" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="74" y="194" font-size="12" fill="#3A3A3A">반도체 산업 리포트 (PDF)</text>
  <text x="74" y="212" font-size="10" fill="#999">보유 ETF 산업 매칭 · 인앱 PDF 뷰어</text>

  <text x="60" y="252" font-size="10.5" fill="#948A72">· 같은 기사는 관련 종목을 병합해 한 번만</text>
  <text x="60" y="270" font-size="10.5" fill="#948A72">· 영문 기사는 자동 번역</text>
  <text x="60" y="288" font-size="10.5" fill="#948A72">· 종목 키워드만 전송 — 보유 금액·계좌 정보 전송 없음</text>

  <!-- ai panel -->
  <rect x="440" y="30" width="380" height="280" rx="20" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="2"/>
  <text x="630" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#3A3A3A">AI 자산 점검</text>

  <rect x="460" y="78" width="340" height="44" rx="10" fill="#FDF6E3"/>
  <text x="474" y="97" font-size="11.5" font-weight="600" fill="#7A6A33">자산배분 점검</text>
  <text x="474" y="113" font-size="10" fill="#948A72">목표 대비 쏠림 · 조정 우선순위</text>

  <rect x="460" y="128" width="340" height="44" rx="10" fill="#FDF6E3"/>
  <text x="474" y="147" font-size="11.5" font-weight="600" fill="#7A6A33">집중도 · 방치 항목 점검</text>
  <text x="474" y="163" font-size="10" fill="#948A72">특정 계좌·종목 집중 경고 · 오래된 리밸런싱</text>

  <rect x="460" y="178" width="340" height="44" rx="10" fill="#FDFBF5" stroke="#EEE7D8"/>
  <text x="474" y="197" font-size="11.5" fill="#3A3A3A">자유 질문</text>
  <text x="474" y="213" font-size="10" fill="#BBB">“지금 현금 비중 적절해?”</text>

  <rect x="460" y="238" width="340" height="52" rx="10" fill="#FFF3E0"/>
  <text x="474" y="259" font-size="11" font-weight="600" fill="#8D6E30">🔒 요약 데이터만 전송</text>
  <text x="474" y="277" font-size="10" fill="#8D6E30">총자산·비중·배분 차이 수준 — 거래 내역·계좌번호 전송 없음</text>
</svg>
