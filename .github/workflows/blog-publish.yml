# 블로그 예약 게시 — 월 · 수 · 금 아침 7시(한국)에 대기 글(blog/queue/) 맨 앞 하나를 내놓는다.
# 글은 미리 써서 대기 폴더에 넣어 둔다. 대기 글이 없으면 그날은 건너뛴다.
# GitHub 예약은 정각을 보장하지 않아(몇 분~30분 늦는다) 10분 일찍 건다.
name: blog-publish

on:
  schedule:
    - cron: "50 21 * * 0,2,4"   # UTC 일 · 화 · 목 21:50 = 한국 월 · 수 · 금 06:50 — 골고루
    - cron: "50 21 * * 3"       # UTC 수 21:50 = 한국 목 06:50 — 뭐타지
  workflow_dispatch:
    inputs:
      blog:
        description: 어느 블로그
        type: choice
        default: blog
        options: [blog, apps/mwotaji/blog]

permissions:
  contents: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Move next queued post
        run: |
          blog="${{ inputs.blog || 'blog' }}"
          if [ "${{ github.event.schedule }}" = "50 21 * * 3" ]; then blog="apps/mwotaji/blog"; fi
          python3 scripts/publish-next-post.py "$blog"
      - name: Build and commit
        run: |
          git add -A blog apps
          if git diff --cached --quiet; then
            echo "내놓을 글 없음"
            exit 0
          fi
          python3 build-docs.py
          git add -A
          git -c user.name="golgoru-bot" -c user.email="golgoru-bot@users.noreply.github.com" \
            commit -m "블로그 예약 게시 ($(TZ=Asia/Seoul date +%F))"
          git push origin HEAD:master
