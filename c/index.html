<script src="../site.js?v=52849407"></script>
<script>
(function () {
  // 나눔터 워커. **토큰을 안 싣는다** — 읽기 라우트 둘(GET /drafts, GET /drafts/{id})만
  // 토큰 없이 열려 있다(2026-08-21). 웹페이지 자바스크립트에 토큰을 박으면 앱
  // 바이너리에 넣는 것보다 나쁘다: 소스 보기 한 번이면 나오고 검색엔진에도 걸린다.
  var API = 'https://asset-management-community.indus96-asset-management.workers.dev';

  // 앱의 크기 블록·도넛과 같은 순서·같은 색(AppStyle.weightBlockPalette). 한 조합이
  // 앱과 웹에서 다른 색으로 보이면 같은 것인지 알아보기 어렵다.
  var PALETTE = [
    '#C8A24A', '#C07C3A', '#A87548', '#8D6E63', '#9A8F6F', '#7E6B4F',
    // 여섯에서 열둘로 늘렸다(2026-08-22) — 10종목이면 일곱 번째부터 색이 처음으로
    // 되돌아가 도넛과 목록을 색만으로는 못 맞췄다. **앞 여섯은 그대로 둔다.**
    '#8A8A5C', '#A65A3C', '#6F7F6A', '#96604F', '#7A7188', '#5F7A82',
  ];

  var state = document.getElementById('state');
  var cards = document.getElementById('cards');

  // 공유 코드 파서. **/p/ 의 것과 같은 규칙이어야 한다**(Swift PortfolioDraftCodec).
  // 여기서 푸는 것은 종목·비중뿐이고, 투자금은 코드에 애초에 없다.
  function decode(code) {
    if (!code || code.indexOf('v1.') !== 0) return null;
    var parts = code.split('.');
    if (parts.length < 4) return null;
    var lines = parts.slice(3).join('.').split(',').map(function (chunk) {
      // 심볼 자체에 ':' 가 들어간다('NASDAQ:TSLA:40') — Swift 코덱처럼 **마지막
      // 콜론**으로 가른다. 전에는 정확히 둘로 갈라야 해서 개별 종목이 담긴 조합이
      // 통째로 「읽을 수 없는 조합」이 됐다(2026-08-25).
      var separator = chunk.lastIndexOf(':');
      if (separator <= 0) return null;
      var weight = parseFloat(chunk.slice(separator + 1));
      if (!isFinite(weight) || weight <= 0) return null;
      return { symbol: chunk.slice(0, separator), weight: weight };
    });
    if (lines.indexOf(null) !== -1) return null;
    // 비중이 큰 것부터 — 앱 카드와 같은 규칙(2026-08-25).
    lines.sort(function (a, b) { return b.weight - a.weight || (a.symbol < b.symbol ? -1 : 1); });
    return lines;
  }

  // 국내 ETF 이름표는 /p/ 가 이미 정적으로 싣고 있다 — 같은 파일을 쓴다.
  // 못 찾으면 심볼을 그대로 보여준다(앱과 같은 규칙).
  var names = {};

  // 올린 쪽이 실어 보낸 「종목 이름」(`심볼=이름|…`). 개별 종목은 정적 이름표에
  // 없어 심볼이 그대로 떴다(2026-08-25) — 서버가 보관만 하는 표시 문자열이라
  // 여기서도 글자로만 그린다. 정적 이름표보다 먼저 이긴다(더 정확한 원천이다).
  function mergeDraftNames(draft) {
    if (!draft || !draft.names) return;
    draft.names.split('|').forEach(function (pair) {
      var separator = pair.indexOf('=');
      if (separator <= 0) return;
      var name = pair.slice(separator + 1);
      if (name && name.length <= 40) names[pair.slice(0, separator)] = name;
    });
  }
  function loadNames() {
    return fetch('../p/kr-etf-names.json')
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (map) { names = map || {}; })
      .catch(function () { names = {}; });
  }

  // 엄지 아이콘. **이모지 문자를 안 쓴다** — 기기·폰트마다 다르게 그려지고 화면
  // 낭독기가 못 읽는다(앱의 `DraftRowCard` 주석과 같은 규칙). 인라인 SVG 로 그린다.
  function thumb(down) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M2 10h4v11H2zM21.6 10.3c-.4-.5-1-.8-1.6-.8h-4.6l.7-3.3c.2-.9-.1-1.8-.7-2.4a2.3 2.3 0 0 0-3.6.5L8.6 9.6c-.2.3-.3.6-.3 1v8.3c0 1.2 1 2.1 2.1 2.1h7.2c1 0 1.9-.7 2.1-1.7l1.4-7c.1-.7-.1-1.4-.5-2z');
    if (down) {
      // 같은 그림을 뒤집는다 — 두 아이콘이 확실히 짝으로 보인다.
      svg.setAttribute('transform', 'rotate(180)');
    }
    svg.appendChild(path);
    return svg;
  }

  function voteButton(down, count, onPress) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'vote';
    button.setAttribute('aria-label', down ? '비추천' : '추천');
    button.appendChild(thumb(down));
    var label = document.createElement('span');
    label.appendChild(text(String(count)));
    button.appendChild(label);
    button.addEventListener('click', function () { onPress(button, label); });
    return button;
  }

  // 「1기기 1표」의 기기 값. 앱은 설치 식별자를 솔트 해시하지만(설계 D절) 브라우저에는
  // 그런 것이 없어 처음 누를 때 만들어 저장한다 — 서버가 보는 것은 어차피 해시 모양의
  // 64자 문자열 하나뿐이라 되짚을 것이 없다.
  function deviceHash() {
    var key = 'golgoru.community.web.device';
    var saved = null;
    try { saved = localStorage.getItem(key); } catch (e) { saved = null; }
    if (saved && /^[a-f0-9]{64}$/.test(saved)) return saved;
    var bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);
    var hex = Array.prototype.map.call(bytes, function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
    try { localStorage.setItem(key, hex); } catch (e) {}
    return hex;
  }

  // 이 브라우저가 무엇에 표를 줬는지. 서버는 알려 주지 않으므로(응답에 voter_hash 가
  // 안 나간다) 눌린 모양을 유지하려면 여기서 기억해야 한다.
  function myVote(id, value) {
    var key = 'golgoru.community.web.votes';
    var map = {};
    try { map = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { map = {}; }
    if (value === undefined) return map[id] || 0;
    map[id] = value;
    try { localStorage.setItem(key, JSON.stringify(map)); } catch (e) {}
    return value;
  }

  function voteRow(draft) {
    var row = document.createElement('div');
    row.className = 'foot';
    var mine = myVote(draft.id);
    var up = voteButton(false, draft.up || 0, function (button, label) { send(1, button, label); });
    var down = voteButton(true, draft.down || 0, function (button, label) { send(-1, button, label); });
    up.setAttribute('aria-pressed', mine === 1 ? 'true' : 'false');
    down.setAttribute('aria-pressed', mine === -1 ? 'true' : 'false');

    function send(value, button) {
      // 같은 것을 다시 누르면 취소다 — 앱과 같은 규칙(워커가 0 을 받는다).
      var next = myVote(draft.id) === value ? 0 : value;
      button.disabled = true;
      fetch(API + '/drafts/' + encodeURIComponent(draft.id) + '/vote', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ vote: next, deviceHash: deviceHash() }),
      })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (result) {
          myVote(draft.id, next);
          up.querySelector('span').textContent = String(result.up);
          down.querySelector('span').textContent = String(result.down);
          up.setAttribute('aria-pressed', next === 1 ? 'true' : 'false');
          down.setAttribute('aria-pressed', next === -1 ? 'true' : 'false');
        })
        .catch(function () {})
        .then(function () { button.disabled = false; });
    }

    row.appendChild(up);
    row.appendChild(down);
    if (draft.taken > 0) {
      var taken = document.createElement('span');
      taken.className = 'taken';
      taken.appendChild(text('가져간 사람 ' + draft.taken));
      row.appendChild(taken);
    }
    return row;
  }

  // 「지난 1년」. **앱이 올릴 때 계산해 보낸 값이다** — 서버도 이 페이지도 시세를
  // 모른다. 그래서 올린 시점 기준이고, 그 사실을 아래 한 줄로 밝힌다.
  function perfBlock(draft, withCurve) {
    if (typeof draft.perf !== 'number') return null;
    var box = document.createElement('div');
    var row = document.createElement('div');
    row.className = 'perf-row';
    var label = document.createElement('span');
    label.className = 'perf-label';
    // 「지난 1년」이라고 쓰지 않는다 — 실제 구간은 종목 이력이 겹치는 만큼이고
    // 앱이 보내는 것은 숫자 하나뿐이라 여기서 구간을 알 수 없다.
    label.appendChild(text('지난 성과'));
    var value = document.createElement('span');
    value.className = 'perf ' + (draft.perf < 0 ? 'perf-down' : 'perf-up');
    value.appendChild(text((draft.perf >= 0 ? '+' : '') + (draft.perf * 100).toFixed(1) + '%'));
    row.appendChild(label);
    row.appendChild(value);
    box.appendChild(row);

    var points = withCurve
      ? (draft.perfCurve || '').split(',').map(Number).filter(function (n) { return isFinite(n); })
      : [];
    if (points.length > 1) {
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'spark');
      svg.setAttribute('viewBox', '0 0 100 30');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', draft.perf < 0 ? '#2b6cb0' : '#c0392b');
      line.setAttribute('stroke-width', '1.6');
      line.setAttribute('vector-effect', 'non-scaling-stroke');
      line.setAttribute('points', points.map(function (p, i) {
        return (i / (points.length - 1)) * 100 + ',' + (30 - p * 28 - 1);
      }).join(' '));
      svg.appendChild(line);
      box.appendChild(svg);
    }

    if (withCurve) {
      var note = document.createElement('div');
      note.className = 'perf-note';
      note.appendChild(text('올린 시점 기준 · 조정종가(배당 재투자 반영) · 지난 값이며 앞으로를 보장하지 않습니다.'));
      box.appendChild(note);
    }
    return box;
  }

  function text(value) {
    // 남이 지은 이름이 들어오는 자리다 — 언제나 텍스트 노드로만 넣는다.
    return document.createTextNode(value);
  }

  function percent(weight) {
    var rounded = Math.round(weight * 100) / 100;
    return (rounded === Math.round(rounded) ? rounded : rounded.toFixed(2)) + '%';
  }

  function card(draft) {
    mergeDraftNames(draft);
    var lines = decode(draft.code);
    // 카드를 통째로 눌러 상세로 간다. 경로가 아니라 쿼리인 것은 GitHub Pages 가
    // 정적 호스팅이라 `/c/{id}` 를 라우팅할 수 없기 때문이다 — 404 우회는 깨지기 쉽다.
    var box = document.createElement('a');
    box.className = 'card card-link';
    box.href = './?id=' + encodeURIComponent(draft.id);

    var title = document.createElement('h2');
    title.appendChild(text(draft.name));
    box.appendChild(title);

    var by = document.createElement('div');
    by.className = 'by';
    var pieces = [];
    if (draft.nick) pieces.push(draft.nick);
    pieces.push(lines ? lines.length + '종목' : '읽을 수 없는 조합');
    by.appendChild(text(pieces.join(' · ')));
    box.appendChild(by);

    if (lines) {
      var band = document.createElement('div');
      band.className = 'band';
      lines.forEach(function (line, index) {
        var seg = document.createElement('i');
        seg.style.width = line.weight + '%';
        seg.style.background = PALETTE[index % PALETTE.length];
        band.appendChild(seg);
      });
      box.appendChild(band);

      var holding = document.createElement('div');
      holding.className = 'holding';
      holding.appendChild(text(lines.map(function (line) {
        return (names[line.symbol] || line.symbol) + ' ' + percent(line.weight);
      }).join(' · ')));
      box.appendChild(holding);
    }

    var perf = perfBlock(draft, false);
    if (perf) box.appendChild(perf);

    // 카드 전체가 링크라 그 안에 버튼을 넣으면 눌렀을 때 페이지가 같이 넘어간다.
    // 투표 줄은 링크 **밖**에 두고 카드 하나를 감싸는 상자로 묶는다.
    var wrapper = document.createElement('div');
    wrapper.className = 'card';
    wrapper.style.padding = '0';
    wrapper.style.overflow = 'hidden';
    box.className = 'card-link';
    box.style.border = '0';
    box.style.display = 'block';
    box.style.padding = '18px';
    wrapper.appendChild(box);

    var foot = voteRow(draft);
    foot.style.margin = '0 18px 16px';
    wrapper.appendChild(foot);
    return wrapper;
  }

  function render(drafts) {
    if (!drafts.length) {
      // 가짜 데이터를 넣지 않는다(설계 G절) — 비어 있으면 비어 있다고 쓴다.
      state.textContent = '아직 올라온 조합이 없습니다.';
      return;
    }
    state.textContent = '';
    drafts.forEach(function (draft) { cards.appendChild(card(draft)); });
  }

  function detailRow(line, index) {
    var row = document.createElement('div');
    row.className = 'detail-row';
    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = PALETTE[index % PALETTE.length];
    var name = document.createElement('span');
    name.className = 'detail-name';
    name.appendChild(text(names[line.symbol] || line.symbol));
    var pct = document.createElement('span');
    pct.className = 'detail-pct';
    pct.appendChild(text(percent(line.weight)));
    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(pct);
    return row;
  }

  // 「노출·분산」. **앱이 계산해 보낸 값이다** — 국가 비중은 ETF 안에 무엇이 들었는지
  // 알아야 나오고, 그것을 아는 시장지표 워커는 토큰이 필요하다. 여기서 하는 일은
  // `한국:51,미국:44|주식:70,채권:30` 을 갈라 그리는 것뿐이다(라벨은 이미 한글).
  function parseExposure(value) {
    if (typeof value !== 'string' || value.indexOf('|') === -1) return null;
    var fields = value.split('|').map(function (field) {
      if (!field) return [];
      var parsed = field.split(',').map(function (pair) {
        var at = pair.lastIndexOf(':');
        var percent = Number(pair.slice(at + 1));
        if (at < 1 || !isFinite(percent)) return null;
        return { label: pair.slice(0, at), percent: percent };
      }).filter(Boolean);
      // 같은 라벨은 합친다 — 옛 빌드가 올린 값에는 「한국」이 두 조각으로 들어
      // 있다(앱과 같은 방어, 2026-08-27).
      var byLabel = {};
      parsed.forEach(function (slice) {
        byLabel[slice.label] = (byLabel[slice.label] || 0) + slice.percent;
      });
      return Object.keys(byLabel).map(function (label) {
        return { label: label, percent: Math.min(byLabel[label], 100) };
      }).sort(function (a, b) { return b.percent - a.percent || (a.label < b.label ? -1 : 1); });
    });
    // 세 번째 칸(업종)은 2026-08-27 에 붙었다 — 옛 값은 두 칸뿐이라 빈 칸으로 채운다.
    while (fields.length < 3) fields.push([]);
    return fields[0].length || fields[1].length || fields[2].length ? fields : null;
  }

  // 국가 > 자산군 > 업종 순서로 **갈리는 그림 둘**을 고른다(앱과 같은 규칙,
  // 2026-08-27) — 「한국 100%」 한 덩어리 도넛은 아무 말도 안 하므로 조각이 둘
  // 이상인 그룹이 먼저 서고, 모자라면 한 조각짜리로 채운다.
  function exposureDisplayIndices(fields) {
    var qualified = [], single = [];
    fields.forEach(function (rows, index) {
      if (rows.length >= 2) qualified.push(index);
      else if (rows.length === 1) single.push(index);
    });
    return qualified.concat(single).slice(0, 2);
  }

  // 앱의 `WeightDonutView` 와 같은 그림 — 12시에서 시작하고, 가운데는 가장 큰 비중.
  function donut(rows) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'donut');
    svg.setAttribute('viewBox', '0 0 42 42');
    svg.setAttribute('aria-hidden', 'true');
    var circumference = Math.PI * 2 * 15.9;
    var offset = 0;
    rows.forEach(function (row, index) {
      var arc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      arc.setAttribute('cx', '21'); arc.setAttribute('cy', '21'); arc.setAttribute('r', '15.9');
      arc.setAttribute('fill', 'none');
      arc.setAttribute('stroke', PALETTE[index % PALETTE.length]);
      arc.setAttribute('stroke-width', '8');
      var length = (row.percent / 100) * circumference;
      arc.setAttribute('stroke-dasharray', Math.max(length - 0.4, 0) + ' ' + circumference);
      arc.setAttribute('stroke-dashoffset', -offset);
      arc.setAttribute('transform', 'rotate(-90 21 21)');
      offset += length;
      svg.appendChild(arc);
    });
    var center = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    center.setAttribute('x', '21'); center.setAttribute('y', '21');
    center.setAttribute('text-anchor', 'middle');
    center.setAttribute('dominant-baseline', 'central');
    center.appendChild(text(rows.length ? rows[0].percent + '%' : ''));
    svg.appendChild(center);
    return svg;
  }

  function exposureColumn(title, rows) {
    var box = document.createElement('div');
    var head = document.createElement('div');
    head.className = 'expo-title';
    head.appendChild(text(title));
    box.appendChild(head);
    // 조각이 하나면 링을 안 그린다 — 100% 한 덩어리 링은 아무 말도 안 한다
    // (앱 allocationDonut 과 같은 규칙). 범례 한 줄이 다 말한다.
    if (rows.length > 1) box.appendChild(donut(rows));
    rows.forEach(function (row, index) {
      var line = document.createElement('div');
      line.className = 'expo-row';
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = PALETTE[index % PALETTE.length];
      var label = document.createElement('b');
      label.appendChild(text(row.label));
      var pct = document.createElement('span');
      pct.appendChild(text(row.percent + '%'));
      line.appendChild(dot);
      line.appendChild(label);
      line.appendChild(pct);
      box.appendChild(line);
    });
    return box;
  }

  function exposureBlock(draft) {
    var fields = parseExposure(draft.exposure);
    if (!fields) return null;
    var box = document.createElement('div');
    box.className = 'expo';
    var head = document.createElement('h3');
    head.textContent = '노출·분산';
    head.style.gridColumn = '1/-1';
    box.appendChild(head);
    var titles = ['국가', '자산군', '업종'];
    exposureDisplayIndices(fields).forEach(function (index) {
      box.appendChild(exposureColumn(titles[index], fields[index]));
    });
    var note = document.createElement('div');
    note.className = 'expo-note';
    note.appendChild(text('국가는 ETF 안을 알 수 있는 종목만 셉니다. 자산군은 종목 이름으로 가릅니다.'));
    box.appendChild(note);
    return box;
  }

  function renderDetail(draft) {
    document.title = draft.name + ' · 골고루 나눔터';
    mergeDraftNames(draft);
    var lines = decode(draft.code);
    var box = document.createElement('div');
    box.className = 'card detail';

    var title = document.createElement('h2');
    title.style.fontSize = '22px';
    title.appendChild(text(draft.name));
    box.appendChild(title);

    var by = document.createElement('div');
    by.className = 'by';
    var pieces = [];
    if (draft.nick) pieces.push(draft.nick);
    pieces.push(lines ? lines.length + '종목' : '읽을 수 없는 조합');

    by.appendChild(text(pieces.join(' · ')));
    box.appendChild(by);

    var detailPerf = perfBlock(draft, true);
    if (detailPerf) box.appendChild(detailPerf);
    box.appendChild(voteRow(draft));

    if (lines) {
      var band = document.createElement('div');
      band.className = 'band';
      lines.forEach(function (line, index) {
        var seg = document.createElement('i');
        seg.style.width = line.weight + '%';
        seg.style.background = PALETTE[index % PALETTE.length];
        band.appendChild(seg);
      });
      box.appendChild(band);
      lines.forEach(function (line, index) { box.appendChild(detailRow(line, index)); });

      // 앱 상세의 「노출·분산」 카드와 같은 그림. 1.4.0 이전에 올라온 조합에는
      // 이 값이 없다 — 그때는 이 절이 통째로 안 나온다.
      var expo = exposureBlock(draft);
      if (expo) box.appendChild(expo);

      // 「가져가기」는 앱이 한다 — 웹에서 남의 짜보기를 내 목록에 넣을 수는 없다.
      // 대신 앱의 [코드로 받기] 에 그대로 넣을 수 있는 코드를 준다.
      var codeBox = document.createElement('div');
      codeBox.className = 'code-box';
      var label = document.createElement('div');
      label.style.fontSize = '13px';
      label.appendChild(text('앱의 「짜보기 > 코드로 받기」에 이 코드를 넣으면 그대로 가져옵니다.'));
      var code = document.createElement('code');
      code.appendChild(text(draft.code));
      var button = document.createElement('button');
      button.className = 'btn btn-primary';
      button.type = 'button';
      button.textContent = '코드 복사';
      button.addEventListener('click', function () {
        navigator.clipboard.writeText(draft.code).then(function () {
          button.textContent = '복사했습니다';
        }, function () {
          button.textContent = '복사하지 못했습니다';
        });
      });
      codeBox.appendChild(label);
      codeBox.appendChild(code);
      codeBox.appendChild(button);
      box.appendChild(codeBox);
    }

    var back = document.createElement('p');
    back.style.marginTop = '20px';
    var backLink = document.createElement('a');
    backLink.href = './';
    backLink.textContent = '← 다른 조합 보기';
    back.appendChild(backLink);

    state.textContent = '';
    document.getElementById('detail').appendChild(box);
    document.getElementById('detail').appendChild(back);
  }

  var id = new URLSearchParams(location.search).get('id');

  loadNames()
    .then(function () {
      return fetch(API + (id ? '/drafts/' + encodeURIComponent(id) : '/drafts?sort=hot'));
    })
    .then(function (response) {
      if (!response.ok) throw new Error(response.status);
      return response.json();
    })
    .then(function (body) {
      if (id) renderDetail(body);
      else render(body.drafts || []);
    })
    .catch(function () {
      // 서버가 죽어도 이 페이지 말고는 아무것도 안 죽는다(설계 G절).
      state.textContent = id
        ? '이 조합은 사라졌거나 지금은 볼 수 없습니다.'
        : '지금은 목록을 불러올 수 없습니다. 잠시 뒤에 다시 열어 주세요.';
    });
})();
</script>
</body></html>
