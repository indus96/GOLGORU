  .lead{color:var(--sub);margin:6px 0 22px}

  .band{display:flex;height:6px;border-radius:999px;overflow:hidden;margin:14px 0 10px;gap:1px}

  .foot{display:flex;gap:14px;align-items:baseline;margin-top:14px;
    padding-top:12px;border-top:1px solid var(--line);font-size:13px}

  .down{color:var(--sub)}
  .taken{margin-left:auto;color:var(--sub);font-size:12px}
  .state{color:var(--sub);padding:26px 0}
  .card-link{display:block;cursor:pointer}
  .card-link:hover{border-color:var(--gold)}
  .detail .band{height:10px;margin:18px 0 14px}
  .detail-row{display:flex;gap:10px;align-items:baseline;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:14px}
  .detail-row:last-of-type{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:3px;flex:none;align-self:center}
  .detail-name{flex:1;min-width:0;color:var(--ink);word-break:break-word}
  .detail-pct{color:var(--sub);font-variant-numeric:tabular-nums}
  .code-box{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg)}
  .code-box code{display:block;font-size:12px;word-break:break-all;color:var(--sub);
    margin:8px 0 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .note{font-size:12px;color:var(--sub);margin-top:26px;line-height:1.8}
  .btn{display:inline-block;padding:11px 20px;border-radius:999px;font-weight:600;
    font-size:14px;cursor:pointer;border:1px solid transparent;font-family:inherit}
  .btn-primary{background:var(--gold);color:#fff}
  .btn-primary:hover{background:#b6911f}

<script src="../site.js"></script>
<script>
(function () {
  // 나눔터 워커. **토큰을 안 싣는다** — 읽기 라우트 둘(GET /drafts, GET /drafts/{id})만
  // 토큰 없이 열려 있다(2026-08-21). 웹페이지 자바스크립트에 토큰을 박으면 앱
  // 바이너리에 넣는 것보다 나쁘다: 소스 보기 한 번이면 나오고 검색엔진에도 걸린다.
  var API = 'https://asset-management-community.indus96-asset-management.workers.dev';

  // 앱의 크기 블록·도넛과 같은 순서·같은 색(AppStyle.weightBlockPalette). 한 조합이
  // 앱과 웹에서 다른 색으로 보이면 같은 것인지 알아보기 어렵다.
  var PALETTE = ['#C8A24A', '#C0763A', '#A8703F', '#8C7B6B', '#8A8A5C', '#9A8577'];

  var state = document.getElementById('state');
  var cards = document.getElementById('cards');

  // 공유 코드 파서. **/p/ 의 것과 같은 규칙이어야 한다**(Swift PortfolioDraftCodec).
  // 여기서 푸는 것은 종목·비중뿐이고, 투자금은 코드에 애초에 없다.
  function decode(code) {
    if (!code || code.indexOf('v1.') !== 0) return null;
    var parts = code.split('.');
    if (parts.length < 4) return null;
    var lines = parts.slice(3).join('.').split(',').map(function (chunk) {
      var pair = chunk.split(':');
      if (pair.length !== 2) return null;
      var weight = parseFloat(pair[1]);
      if (!isFinite(weight) || weight <= 0) return null;
      return { symbol: pair[0], weight: weight };
    });
    return lines.indexOf(null) === -1 ? lines : null;
  }

  // 국내 ETF 이름표는 /p/ 가 이미 정적으로 싣고 있다 — 같은 파일을 쓴다.
  // 못 찾으면 심볼을 그대로 보여준다(앱과 같은 규칙).
  var names = {};
  function loadNames() {
    return fetch('../p/kr-etf-names.json')
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (map) { names = map || {}; })
      .catch(function () { names = {}; });
  }

  function text(value) {
    // 남이 지은 이름이 들어오는 자리다 — 언제나 텍스트 노드로만 넣는다.
    return document.createTextNode(value);
  }

  function percent(weight) {
    var rounded = Math.round(weight * 100) / 100;
    return (rounded === Math.round(rounded) ? rounded : rounded.toFixed(2)) + '%';
  }

  function card(draft) {
    var lines = decode(draft.code);
    // 카드를 통째로 눌러 상세로 간다. 경로가 아니라 쿼리인 것은 GitHub Pages 가
    // 정적 호스팅이라 `/c/{id}` 를 라우팅할 수 없기 때문이다 — 404 우회는 깨지기 쉽다.
    var box = document.createElement('a');
    box.className = 'card card-link';
    box.href = './?id=' + encodeURIComponent(draft.id);

    var title = document.createElement('h2');
    title.appendChild(text(draft.name));
    box.appendChild(title);

    var by = document.createElement('div');
    by.className = 'by';
    var pieces = [];
    if (draft.nick) pieces.push(draft.nick);
    pieces.push(lines ? lines.length + '종목' : '읽을 수 없는 조합');
    by.appendChild(text(pieces.join(' · ')));
    box.appendChild(by);

    if (lines) {
      var band = document.createElement('div');
      band.className = 'band';
      lines.forEach(function (line, index) {
        var seg = document.createElement('i');
        seg.style.width = line.weight + '%';
        seg.style.background = PALETTE[index % PALETTE.length];
        band.appendChild(seg);
      });
      box.appendChild(band);

      var holding = document.createElement('div');
      holding.className = 'holding';
      holding.appendChild(text(lines.map(function (line) {
        return (names[line.symbol] || line.symbol) + ' ' + percent(line.weight);
      }).join(' · ')));
      box.appendChild(holding);
    }

    var foot = document.createElement('div');
    foot.className = 'foot';
    var up = document.createElement('span');
    up.className = 'up';
    up.appendChild(text('추천 ' + (draft.up || 0)));
    var down = document.createElement('span');
    down.className = 'down';
    down.appendChild(text('비추천 ' + (draft.down || 0)));
    foot.appendChild(up);
    foot.appendChild(down);
    if (draft.taken > 0) {
      var taken = document.createElement('span');
      taken.className = 'taken';
      taken.appendChild(text('가져간 사람 ' + draft.taken));
      foot.appendChild(taken);
    }
    box.appendChild(foot);
    return box;
  }

  function render(drafts) {
    if (!drafts.length) {
      // 가짜 데이터를 넣지 않는다(설계 G절) — 비어 있으면 비어 있다고 쓴다.
      state.textContent = '아직 올라온 조합이 없습니다.';
      return;
    }
    state.textContent = '';
    drafts.forEach(function (draft) { cards.appendChild(card(draft)); });
  }

  function detailRow(line, index) {
    var row = document.createElement('div');
    row.className = 'detail-row';
    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = PALETTE[index % PALETTE.length];
    var name = document.createElement('span');
    name.className = 'detail-name';
    name.appendChild(text(names[line.symbol] || line.symbol));
    var pct = document.createElement('span');
    pct.className = 'detail-pct';
    pct.appendChild(text(percent(line.weight)));
    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(pct);
    return row;
  }

  function renderDetail(draft) {
    document.title = draft.name + ' · 골고루 나눔터';
    var lines = decode(draft.code);
    var box = document.createElement('div');
    box.className = 'card detail';

    var title = document.createElement('h2');
    title.style.fontSize = '22px';
    title.appendChild(text(draft.name));
    box.appendChild(title);

    var by = document.createElement('div');
    by.className = 'by';
    var pieces = [];
    if (draft.nick) pieces.push(draft.nick);
    pieces.push(lines ? lines.length + '종목' : '읽을 수 없는 조합');
    pieces.push('추천 ' + (draft.up || 0));
    if (draft.taken > 0) pieces.push('가져간 사람 ' + draft.taken);
    by.appendChild(text(pieces.join(' · ')));
    box.appendChild(by);

    if (lines) {
      var band = document.createElement('div');
      band.className = 'band';
      lines.forEach(function (line, index) {
        var seg = document.createElement('i');
        seg.style.width = line.weight + '%';
        seg.style.background = PALETTE[index % PALETTE.length];
        band.appendChild(seg);
      });
      box.appendChild(band);
      lines.forEach(function (line, index) { box.appendChild(detailRow(line, index)); });

      // 「가져가기」는 앱이 한다 — 웹에서 남의 짜보기를 내 목록에 넣을 수는 없다.
      // 대신 앱의 [코드로 받기] 에 그대로 넣을 수 있는 코드를 준다.
      var codeBox = document.createElement('div');
      codeBox.className = 'code-box';
      var label = document.createElement('div');
      label.style.fontSize = '13px';
      label.appendChild(text('앱의 「짜보기 > 코드로 받기」에 이 코드를 넣으면 그대로 가져옵니다.'));
      var code = document.createElement('code');
      code.appendChild(text(draft.code));
      var button = document.createElement('button');
      button.className = 'btn btn-primary';
      button.type = 'button';
      button.textContent = '코드 복사';
      button.addEventListener('click', function () {
        navigator.clipboard.writeText(draft.code).then(function () {
          button.textContent = '복사했습니다';
        }, function () {
          button.textContent = '복사하지 못했습니다';
        });
      });
      codeBox.appendChild(label);
      codeBox.appendChild(code);
      codeBox.appendChild(button);
      box.appendChild(codeBox);
    }

    var back = document.createElement('p');
    back.style.marginTop = '20px';
    var backLink = document.createElement('a');
    backLink.href = './';
    backLink.textContent = '← 다른 조합 보기';
    back.appendChild(backLink);

    state.textContent = '';
    document.getElementById('detail').appendChild(box);
    document.getElementById('detail').appendChild(back);
  }

  var id = new URLSearchParams(location.search).get('id');

  loadNames()
    .then(function () {
      return fetch(API + (id ? '/drafts/' + encodeURIComponent(id) : '/drafts?sort=hot'));
    })
    .then(function (response) {
      if (!response.ok) throw new Error(response.status);
      return response.json();
    })
    .then(function (body) {
      if (id) renderDetail(body);
      else render(body.drafts || []);
    })
    .catch(function () {
      // 서버가 죽어도 이 페이지 말고는 아무것도 안 죽는다(설계 G절).
      state.textContent = id
        ? '이 조합은 사라졌거나 지금은 볼 수 없습니다.'
        : '지금은 목록을 불러올 수 없습니다. 잠시 뒤에 다시 열어 주세요.';
    });
})();
</script>
